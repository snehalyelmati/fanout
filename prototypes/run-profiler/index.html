<!doctype html>
<!-- Three from-scratch analysis workbenches for the offline Fanout profiler, switchable via ?variant=A|B|C. PROTOTYPE — do not ship. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fanout Profiler — Analysis Workbench Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#080b10; --surface:#0e141d; --surface2:#131c27; --line:#273345; --line2:#37475e;
      --text:#eef3f8; --muted:#8c9aad; --blue:#5fb4ff; --cyan:#55d7dc; --green:#5ed18a;
      --amber:#efbd59; --red:#ef707b; --violet:#a78bfa; --observed:#5ed18a; --derived:#55d7dc;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box} body{margin:0;min-width:360px;min-height:100vh;background:var(--bg);color:var(--text)}
    button,input{font:inherit} button{color:inherit} button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
    h1,h2,h3,p{margin-top:0} h1{font-size:1rem;margin-bottom:2px} h2{font-size:.9rem;margin-bottom:10px} h3{font-size:.75rem;margin-bottom:8px}
    small,.muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .shell{min-height:100vh;padding-bottom:76px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 15px;border-bottom:1px solid var(--line);background:#0b1017}
    .brand,.toolbar,.cluster{display:flex;align-items:center;gap:8px}.brandmark{width:32px;height:32px;display:grid;place-items:center;border:1px solid #35626a;border-radius:8px;background:#10262c;color:var(--cyan);font-weight:800}
    .root{font-size:.67rem;color:var(--muted)}.btn{padding:6px 9px;border:1px solid var(--line2);border-radius:6px;background:var(--surface2);cursor:pointer;font-size:.72rem}.btn:hover,.btn.active{border-color:var(--cyan);background:#143039}.btn.primary{background:#173741;border-color:#36747d}.btn.ghost{background:transparent}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);font-size:.62rem;white-space:nowrap}.badge.observed{color:var(--green);border-color:#315c43;background:#10251a}.badge.derived{color:var(--cyan);border-color:#315961;background:#102329}.badge.partial{color:var(--amber);border-color:#65532d;background:#2a2211}.badge.scenario{color:#c5b7ff;border-color:#544581;background:#211a3a}.badge.exact{color:#9bc8ff;border-color:#385b83;background:#14243b}
    .panel{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}.panel-head{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line)}.panel-head h2,.panel-head h3{margin:0}.panel-body{padding:11px}
    .warning,.info{padding:8px 9px;border-radius:6px;font-size:.68rem;line-height:1.4}.warning{border:1px solid #5d4b28;background:#251e10;color:#f0d28c}.info{border:1px solid #31545c;background:#0f2026;color:#bde8eb}
    .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 9px;font-size:.68rem}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.receipt{border-left:3px solid var(--cyan)}
    .switcher{position:fixed;z-index:100;left:50%;bottom:15px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border:1px solid #657386;border-radius:999px;background:#edf2f7;color:#111827;box-shadow:0 12px 36px #000c}.switcher button{width:32px;height:29px;border:0;border-radius:999px;background:#d7e0e9;color:#111827;cursor:pointer}.switcher strong{min-width:230px;text-align:center;font-size:.72rem}
    .metric-strip{display:grid;grid-template-columns:repeat(5,minmax(105px,1fr));border-bottom:1px solid var(--line)}.metric{padding:9px 11px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric small,.metric b{display:block}.metric b{margin:3px 0;font-size:.98rem}.metric em{color:var(--muted);font-size:.61rem;font-style:normal}

    /* A — trace waterfall */
    .trace-layout{display:grid;grid-template-columns:minmax(720px,1fr) 310px;min-height:calc(100vh - 58px)}.trace-main{min-width:0;border-right:1px solid var(--line)}.inspector{padding:11px;display:grid;align-content:start;gap:10px;background:#0b1017}
    .waterfall-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;border-bottom:1px solid var(--line)}.zoom{display:flex;align-items:center;gap:7px;font-size:.66rem;color:var(--muted)}.zoom input{width:100px;accent-color:var(--cyan)}
    .waterfall-scroll{overflow:auto}.waterfall{min-width:760px;width:var(--waterfall-width,100%)}.time-axis,.lane{display:grid;grid-template-columns:190px minmax(570px,1fr)}.time-axis{position:sticky;top:0;z-index:5;background:#0b1119;border-bottom:1px solid var(--line)}.axis-label{padding:8px 10px;color:var(--muted);font-size:.63rem}.ticks{position:relative;height:31px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),#1f2a38 calc(12.5% - 1px),#1f2a38 12.5%)}.tick{position:absolute;top:8px;transform:translateX(-50%);font-size:.59rem;color:var(--muted)}
    .lane{min-height:35px;border-bottom:1px solid #17202c}.lane:hover,.lane.selected{background:#111e29}.lane-label{display:flex;align-items:center;gap:6px;padding:6px 9px;border-right:1px solid var(--line);font-size:.68rem;cursor:pointer}.lane-label .indent{display:inline-block;width:var(--indent,0)}.lane-label b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lane-track{position:relative;min-height:35px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),#17212d calc(12.5% - 1px),#17212d 12.5%)}
    .bar{position:absolute;top:7px;height:20px;min-width:3px;border:1px solid #426985;border-radius:4px;background:#1b5680;cursor:pointer;overflow:hidden}.bar:hover,.lane.selected .bar{filter:brightness(1.3);box-shadow:0 0 0 1px #83cffd}.bar.worker{top:9px;height:16px;background:#245f68;border-color:#3a8d95}.bar.validation{top:9px;height:16px;background:#725427;border-color:#a47c39}.bar.tool{top:9px;height:16px;min-width:7px;background:#594888;border-color:#826cc2}.bar.rejected{background:#6d2933;border-color:#a84855}.bar.final{background:#2c6843;border-color:#4aa36b}.bar.critical{box-shadow:inset 0 -3px 0 var(--red)}.bar-label{padding:2px 5px;font-size:.58rem;white-space:nowrap}.marker{position:absolute;top:0;bottom:0;width:1px;background:var(--amber)}.marker::after{content:"";position:absolute;top:2px;left:-3px;border:3px solid var(--amber);border-radius:50%}
    .lane.group .lane-label{font-weight:700;background:#101822}.lane.group .lane-track{background-color:#0d151f}.legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 11px;border-top:1px solid var(--line);font-size:.62rem;color:var(--muted)}.swatch{width:9px;height:9px;display:inline-block;border-radius:2px;margin-right:4px;background:#1b5680}.swatch.worker{background:#245f68}.swatch.validation{background:#725427}.swatch.rejected{background:#6d2933}.swatch.critical{background:var(--red)}
    .observation{display:block;width:100%;padding:8px;border:1px solid transparent;border-radius:6px;background:#0b121a;text-align:left;cursor:pointer}.observation:hover{border-color:var(--line2)}.observation b,.observation small{display:block}.observation b{font-size:.68rem;margin-bottom:3px}

    /* B — causal graph */
    .graph-layout{display:grid;grid-template-columns:minmax(700px,1fr) 330px;min-height:calc(100vh - 58px)}.graph-main{display:grid;grid-template-rows:auto minmax(390px,1fr) 210px;min-width:0;border-right:1px solid var(--line)}.graph-toolbar{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.graph-stage{position:relative;overflow:auto;background-image:linear-gradient(#161f2a 1px,transparent 1px),linear-gradient(90deg,#161f2a 1px,transparent 1px);background-size:24px 24px}.graph-stage svg{display:block;min-width:760px;width:100%;height:100%}.edge{fill:none;stroke:#44546a;stroke-width:2}.edge.critical{stroke:var(--red);stroke-width:3}.edge.concurrent{stroke-dasharray:5 4}.graph-node rect{fill:#121c28;stroke:#4b5f78;stroke-width:1.5}.graph-node:hover rect,.graph-node.selected rect{fill:#16313c;stroke:var(--cyan);stroke-width:2}.graph-node text{fill:var(--text);font-size:12px}.graph-node .sub{fill:var(--muted);font-size:9px}.graph-node .status-fill{fill:#234b36;stroke:none}.graph-node .status-repair{fill:#5d4524;stroke:none}.graph-node .critical-line{fill:var(--red);stroke:none}
    .graph-callout{position:absolute;left:12px;top:12px;width:240px}.analysis-dock{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:#0b1017}.analysis-dock>section{padding:10px;overflow:auto}.analysis-dock>section+section{border-left:1px solid var(--line)}.mini-waterfall{display:grid;gap:5px}.mini-row{display:grid;grid-template-columns:85px 1fr 48px;align-items:center;gap:7px;font-size:.63rem}.mini-track{height:10px;border-radius:3px;background:#1c2633;overflow:hidden}.mini-fill{height:100%;background:var(--cyan)}

    /* C — synchronized run diff */
    .diff-layout{display:grid;grid-template-columns:minmax(780px,1fr) 320px;min-height:calc(100vh - 58px)}.diff-main{min-width:0;border-right:1px solid var(--line)}.compare-head{display:grid;grid-template-columns:190px 1fr 1fr 90px;border-bottom:1px solid var(--line);background:#0b1118}.compare-head>div{padding:9px 10px;border-right:1px solid var(--line)}.run-title b,.run-title small{display:block}.diff-scroll{overflow:auto}.diff-table{min-width:780px}.diff-row{display:grid;grid-template-columns:190px 1fr 1fr 90px;min-height:61px;border-bottom:1px solid #192330}.diff-row:hover,.diff-row.selected{background:#111e29}.diff-label{padding:10px;border-right:1px solid var(--line);cursor:pointer}.diff-label b,.diff-label small{display:block}.diff-cell{position:relative;padding:9px 10px;border-right:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),#182330 calc(25% - 1px),#182330 25%)}.diff-track{position:relative;height:25px;margin-top:8px;background:#111923;border-radius:3px}.diff-bar{position:absolute;top:3px;height:19px;border:1px solid #4478a0;border-radius:3px;background:#1d5b87;min-width:3px}.diff-bar.failed{background:#6b2e37;border-color:#a54b56}.diff-bar.ghost{top:1px;height:23px;background:#8069c333;border:1px dashed var(--violet);z-index:2}.diff-value{position:absolute;right:4px;top:4px;font-size:.59rem}.delta{display:grid;place-items:center;padding:8px;font-size:.67rem}.delta.up{color:var(--red)}.delta.down{color:var(--green)}.delta.na{color:var(--muted)}
    .scenario-drawer{margin:11px;border-color:#514579}.scenario-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.scenario-card{padding:9px;border:1px solid var(--line);border-radius:6px;background:#0b121a}.scenario-card b,.scenario-card small{display:block}.scenario-card b{margin:5px 0}.control{display:grid;gap:5px;font-size:.65rem;color:var(--muted)}.control input{width:100%;accent-color:var(--violet)}

    @media(max-width:1000px){.trace-layout,.graph-layout,.diff-layout{grid-template-columns:1fr}.trace-main,.graph-main,.diff-main{border-right:0}.inspector{border-top:1px solid var(--line);grid-template-columns:1fr 1fr}.toolbar .optional{display:none}}
    @media(max-width:700px){.topbar .toolbar{display:none}.metric-strip{overflow:auto}.trace-layout,.graph-layout,.diff-layout{display:block}.inspector{grid-template-columns:1fr}.analysis-dock{grid-template-columns:1fr}.analysis-dock>section+section{border-left:0;border-top:1px solid var(--line)}.switcher strong{min-width:180px}.scenario-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="app" class="shell"></div>
  <nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><strong id="variant-name"></strong><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const variants={A:"Trace Waterfall",B:"Causal Graph",C:"Synchronized Run Diff"};
    const state={selected:"api-repair",zoom:120,scenarioConcurrency:3,criticalOnly:false};
    const total=465;
    const entities={
      run:{title:"Execution Run · run-019",kind:"Run",status:"Completed",duration:"7m 45s",cost:"$1.138",source:"events.jsonl",location:"events 1–22",fact:"run-completed"},
      preflight:{title:"Preflight",kind:"Run phase",status:"Passed",duration:"17s",cost:"—",source:"events.jsonl",location:"events 1–3",fact:"preflight-completed"},
      core:{title:"core-types",kind:"DAG Node",status:"Accepted",duration:"1m 08s",cost:"$0.182",source:"events.jsonl",location:"events 4–8",fact:"node-completed: accepted"},
      "core-attempt":{title:"attempt-01",kind:"Attempt",status:"Accepted",duration:"1m 08s",cost:"$0.182",source:"attempts/attempt-01/outcome.json",location:"root",fact:"controllerAction: accept"},
      api:{title:"api-adapter",kind:"DAG Node",status:"Accepted after repair",duration:"5m 28s envelope",cost:"$0.391",source:"events.jsonl",location:"events 9–18",fact:"node-completed: accepted"},
      "api-initial":{title:"attempt-02 · initial",kind:"Attempt",status:"Rejected",duration:"2m 12s",cost:"$0.214",source:"attempts/attempt-02/outcome.json",location:"stageFact",fact:"node-validation-failed"},
      "api-repair":{title:"attempt-04 · validation repair",kind:"Attempt",status:"Accepted",duration:"3m 15s",cost:"$0.177",source:"attempts/attempt-04/outcome.json",location:"stageFact",fact:"candidate-accepted"},
      docs:{title:"docs",kind:"DAG Node",status:"Accepted",duration:"1m 27s",cost:"$0.223",source:"events.jsonl",location:"events 10–13",fact:"node-completed: accepted"},
      "docs-attempt":{title:"attempt-03",kind:"Attempt",status:"Accepted",duration:"1m 27s",cost:"$0.223",source:"attempts/attempt-03/outcome.json",location:"root",fact:"controllerAction: accept"},
      final:{title:"Final Validation Gate",kind:"Run gate",status:"Passed",duration:"7.0s",cost:"$0",source:"events.jsonl",location:"events 21–22",fact:"final-validation-passed"}
    };
    const lanes=[
      {id:"preflight",label:"Preflight",start:0,end:17,type:"group",critical:true},
      {id:"core",label:"core-types",start:17,end:85,type:"group",critical:true},
      {id:"core-attempt",label:"attempt-01",start:17,end:85,indent:18,critical:true},
      {id:"core-worker",entity:"core-attempt",label:"Worker",start:18,end:81,indent:36,type:"worker",critical:true},
      {id:"core-tools",entity:"core-attempt",label:"Tools · 0.3s",start:44,end:44.3,indent:36,type:"tool"},
      {id:"core-validation",entity:"core-attempt",label:"Node Validation",start:81,end:85,indent:36,type:"validation",critical:true},
      {id:"api",label:"api-adapter",start:86,end:414,type:"group",critical:true},
      {id:"api-initial",label:"attempt-02 · rejected",start:86,end:218,indent:18,type:"rejected",critical:true,marker:218},
      {id:"api-worker",entity:"api-initial",label:"Worker",start:87,end:208,indent:36,type:"worker",critical:true},
      {id:"api-validation",entity:"api-initial",label:"Validation · failed",start:208,end:218,indent:36,type:"validation",critical:true},
      {id:"api-repair",label:"attempt-04 · repair",start:219,end:414,indent:18,critical:true},
      {id:"repair-worker",entity:"api-repair",label:"Worker",start:220,end:398,indent:36,type:"worker",critical:true},
      {id:"repair-validation",entity:"api-repair",label:"Validation",start:398,end:414,indent:36,type:"validation",critical:true},
      {id:"docs",label:"docs",start:86,end:173,type:"group"},
      {id:"docs-attempt",label:"attempt-03",start:86,end:173,indent:18},
      {id:"docs-worker",entity:"docs-attempt",label:"Worker",start:87,end:166,indent:36,type:"worker"},
      {id:"docs-validation",entity:"docs-attempt",label:"Node Validation",start:166,end:173,indent:36,type:"validation"},
      {id:"final",label:"Final Validation Gate",start:458,end:465,type:"final",critical:true}
    ];
    function badge(type,label=type[0].toUpperCase()+type.slice(1)){return `<span class="badge ${type}">${label}</span>`}
    function topbar(extra=""){return `<header class="topbar"><div class="brand"><div class="brandmark">F</div><div><h1>Fanout Profiler <span class="badge">ANALYSIS PROTOTYPE</span></h1><div class="root mono">p-map-normalizers / run-019</div></div></div><div class="toolbar">${badge("observed","Current generation")}${badge("exact","Exact packet cohort")} ${extra}<button class="btn ghost">Refresh catalog</button></div></header>`}
    function metrics(){return `<div class="metric-strip"><div class="metric"><small>Wall time ${badge("observed")}</small><b>7m 45s</b><em>event 1 → 22</em></div><div class="metric"><small>Critical path ${badge("derived")}</small><b>7m 32s</b><em>core → api → final</em></div><div class="metric"><small>Attempt work ${badge("derived")}</small><b>7m 17s</b><em>overlaps; not a partition</em></div><div class="metric"><small>Tokens ${badge("observed")}</small><b>655,081</b><em>6 completed attempts</em></div><div class="metric"><small>Cost ${badge("observed")}</small><b>$1.138</b><em>$0.214 rejected output</em></div></div>`}
    function receipt(entity=entities[state.selected]||entities.run){return `<div class="panel receipt"><div class="panel-head"><h3>Evidence Receipt</h3>${badge("observed")}</div><div class="panel-body"><dl class="kv"><dt>Selection</dt><dd>${entity.title}</dd><dt>Class</dt><dd>${entity.kind}</dd><dt>Source</dt><dd class="mono">${entity.source}</dd><dt>Location</dt><dd class="mono">${entity.location}</dd><dt>Typed fact</dt><dd class="mono">${entity.fact}</dd><dt>Generation</dt><dd>packet-v6 / event-v2 / projection-v3</dd><dt>Identity</dt><dd class="mono">sha256:9e3a…7bd2 · 18,244 bytes</dd></dl></div></div>`}
    function inspector(){const e=entities[state.selected]||entities.run;return `<aside class="inspector"><div class="panel"><div class="panel-head"><h2>${e.title}</h2>${e.status.includes("Rejected")?badge("partial","Rejected"):badge("observed",e.status)}</div><div class="panel-body"><dl class="kv"><dt>Kind</dt><dd>${e.kind}</dd><dt>Duration</dt><dd>${e.duration}</dd><dt>Cost</dt><dd>${e.cost}</dd></dl></div></div>${receipt(e)}<div class="panel"><div class="panel-head"><h3>Diagnostic Observations</h3><span class="badge">No ranking</span></div><div class="panel-body cluster" style="align-items:stretch;flex-direction:column"><button class="observation" data-select="api-initial"><b>Rejected work consumed $0.214</b><small>Output was rejected after Node Validation.</small></button><button class="observation" data-select="api"><b>Ready work waited 19.4s with capacity unused</b><small>Calculated from allocation and completion events.</small></button><div class="observation"><b>Provider sub-lane timing unavailable</b><small>Canonical records lack absolute intervals.</small></div></div></div></aside>`}
    function pct(value){return value/total*100}
    function waterfall(){const ticks=[0,60,120,180,240,300,360,420,465];const visible=state.criticalOnly?lanes.filter(l=>l.critical):lanes;return `<div class="waterfall-scroll"><div class="waterfall" style="--waterfall-width:${state.zoom}%"><div class="time-axis"><div class="axis-label">Hierarchy</div><div class="ticks">${ticks.map(t=>`<span class="tick" style="left:${pct(t)}%">${t===465?"7:45":`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`}</span>`).join("")}</div></div>${visible.map(l=>{const entity=l.entity||l.id;return `<div class="lane ${l.type==="group"?"group":""} ${state.selected===entity?"selected":""}"><button class="lane-label btn ghost" data-select="${entity}" style="--indent:${l.indent||0}px"><span class="indent"></span><b>${l.label}</b></button><div class="lane-track"><button class="bar ${l.type||""} ${l.critical?"critical":""}" data-select="${entity}" aria-label="${l.label}, ${l.end-l.start} seconds" style="left:${pct(l.start)}%;width:${Math.max(pct(l.end-l.start),.5)}%"><span class="bar-label">${l.end-l.start>=18?`${Math.round(l.end-l.start)}s`:""}</span></button>${l.marker?`<span class="marker" style="left:${pct(l.marker)}%"></span>`:""}</div></div>`}).join("")}</div></div>`}
    function traceVariant(){return `${topbar()}<div class="trace-layout"><main class="trace-main">${metrics()}<div class="waterfall-toolbar"><div><b style="font-size:.76rem">Observed causal waterfall</b><small style="margin-left:8px">Wall-clock aligned; nested lanes are not additive.</small></div><div class="cluster"><button class="btn ${state.criticalOnly?"active":""}" id="critical-toggle">Critical path only</button><label class="zoom">Zoom <input id="zoom" type="range" min="100" max="220" value="${state.zoom}"></label></div></div>${waterfall()}<div class="legend"><span><i class="swatch"></i>Attempt envelope</span><span><i class="swatch worker"></i>Worker</span><span><i class="swatch validation"></i>Validation</span><span><i class="swatch rejected"></i>Rejected</span><span><i class="swatch critical"></i>Critical path</span>${badge("partial","Unknown sub-lanes remain blank")}</div></main>${inspector()}</div>`}
    function graphSvg(){return `<svg viewBox="0 0 920 430" role="img" aria-label="Execution DAG with observed schedule and critical path"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/></marker><marker id="arrowCritical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef707b"/></marker></defs>
      <path class="edge critical" marker-end="url(#arrowCritical)" d="M210 218 C255 218 265 150 310 150"/><path class="edge concurrent" marker-end="url(#arrow)" d="M210 218 C255 218 265 290 310 290"/><path class="edge critical" marker-end="url(#arrowCritical)" d="M490 150 C550 150 555 218 615 218"/><path class="edge" marker-end="url(#arrow)" d="M490 290 C550 290 555 218 615 218"/>
      ${graphNode("core",30,178,180,80,"core-types","1:08 · accepted",true,"status-fill")}${graphNode("api",310,110,180,80,"api-adapter","5:28 · repair",true,"status-repair")}${graphNode("docs",310,250,180,80,"docs","1:27 · accepted",false,"status-fill")}${graphNode("final",615,178,230,80,"Final Validation Gate","0:07 · passed",true,"status-fill")}
      <text x="250" y="205" fill="#8c9aad" font-size="10">dependency</text><text x="500" y="117" fill="#ef707b" font-size="10">observed critical path</text><text x="230" y="340" fill="#8c9aad" font-size="10">api-adapter and docs overlap after core-types</text>
    </svg>`}
    function graphNode(id,x,y,w,h,title,sub,critical,status){return `<g class="graph-node ${state.selected===id?"selected":""}" data-select="${id}" role="button" tabindex="0"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><rect class="${status}" x="${x+1}" y="${y+1}" width="5" height="${h-2}" rx="3"/>${critical?`<rect class="critical-line" x="${x+12}" y="${y+h-5}" width="${w-24}" height="3"/>`:""}<text x="${x+16}" y="${y+31}">${title}</text><text class="sub" x="${x+16}" y="${y+52}">${sub}</text></g>`}
    function miniWaterfall(){const selected=state.selected==="api"?[["Initial",132,"rejected"],["Repair",195,""],["Validation",16,""]]:state.selected==="docs"?[["Worker",79,""],["Validation",7,""]]:state.selected==="core"?[["Worker",63,""],["Validation",4,""]]:[["Validation",7,""]];const max=Math.max(...selected.map(x=>x[1]));return `<div class="mini-waterfall">${selected.map(([name,duration,status])=>`<div class="mini-row"><span>${name}</span><div class="mini-track"><div class="mini-fill" style="width:${duration/max*100}%;background:${status?"var(--red)":"var(--cyan)"}"></div></div><span>${duration}s</span></div>`).join("")}</div>`}
    function graphVariant(){const e=entities[state.selected]||entities.api;return `${topbar()}<div class="graph-layout"><main class="graph-main"><div class="graph-toolbar"><div class="cluster"><button class="btn active">Observed schedule</button><button class="btn">Structural DAG</button><button class="btn">Accepted ledger</button></div><div class="cluster">${badge("derived","Critical path calculated")}<button class="btn">Fit graph</button></div></div><section class="graph-stage"><div class="panel graph-callout"><div class="panel-head"><h3>Graph reading</h3></div><div class="panel-body"><small>Topology shows what could run. Edge and node overlays show what did run. Red undersides mark the observed critical path.</small></div></div>${graphSvg()}</section><section class="analysis-dock"><section><div class="panel-head" style="padding-left:0"><h3>Selected node schedule · ${e.title}</h3>${badge("observed")}</div>${miniWaterfall()}</section><section><div class="panel-head" style="padding-left:0"><h3>Causal facts</h3><span class="badge">Typed only</span></div><dl class="kv"><dt>Entry</dt><dd>Dependencies accepted at 01:25</dd><dt>Attempt 02</dt><dd>Node Validation failed</dd><dt>Action</dt><dd>Validation repair allocated</dd><dt>Exit</dt><dd>Candidate accepted at 06:54</dd></dl></section></section></main>${inspector()}</div>`}
    const diffRows=[
      {id:"core",name:"core-types",failed:82,completed:68,delta:"−14s",trend:"down"},
      {id:"api",name:"api-adapter",failed:132,completed:328,delta:"+196s",trend:"up"},
      {id:"docs",name:"docs",failed:79,completed:87,delta:"+8s",trend:"up"},
      {id:"final",name:"Final Validation",failed:0,completed:7,delta:"scope",trend:"na"}
    ];
    function diffTable(){return `<div class="diff-scroll"><div class="diff-table"><div class="compare-head"><div>Aligned packet nodes</div><div class="run-title"><b>run-018 · failed</b><small>4m 20s · $0.809</small></div><div class="run-title"><b>run-019 · completed</b><small>7m 45s · $1.138</small></div><div>Raw Δ</div></div>${diffRows.map(r=>`<div class="diff-row ${state.selected===r.id?"selected":""}"><button class="diff-label btn ghost" data-select="${r.id}"><b>${r.name}</b><small>${r.id==="api"?"attempt + repair":"aligned Work Contract"}</small></button>${diffCell(r.failed,260,"failed")}${diffCell(r.completed,465,"",r.id==="api")}<div class="delta ${r.trend}">${r.delta}</div></div>`).join("")}</div></div>`}
    function diffCell(duration,max,status,scenario=false){const scenarioDuration=Math.max(1,duration-(state.scenarioConcurrency-2)*37);return `<div class="diff-cell"><div class="diff-track">${scenario?`<span class="diff-bar ghost" style="width:${scenarioDuration/max*100}%" title="Scenario overlay"></span>`:""}<span class="diff-bar ${status}" style="width:${duration/max*100}%"></span><span class="diff-value">${duration?`${Math.floor(duration/60)}:${String(duration%60).padStart(2,"0")}`:"—"}</span></div></div>`}
    function scenarioDrawer(){const calculated=465-(state.scenarioConcurrency-2)*37;return `<div class="panel scenario-drawer"><div class="panel-head"><div><h2>Scenario overlay</h2><small>Violet outline is calculated over the observed completed run.</small></div>${badge("scenario","Illustrative contract")}</div><div class="panel-body"><div class="scenario-grid"><div class="scenario-card"><small>Observed baseline</small><b>7m 45s</b><small>Concurrency 2 · unchanged evidence</small></div><div class="scenario-card"><label class="control">Concurrency · ${state.scenarioConcurrency}<input id="scenario-concurrency" type="range" min="1" max="4" value="${state.scenarioConcurrency}"></label></div><div class="scenario-card"><small>Calculated result</small><b>${Math.floor(calculated/60)}m ${String(calculated%60).padStart(2,"0")}s</b><small>Arithmetic, not a forecast</small></div></div><div class="warning" style="margin-top:9px">Preserves the observed DAG, attempts, durations, outcomes, tokens, validation, and accepted-ledger constraints. Failed and completed runs have different completed scope; the raw delta cannot name a winner.</div></div></div>`}
    function diffVariant(){return `${topbar(`<span class="badge scenario">Scenario overlay on</span>`)}<div class="diff-layout"><main class="diff-main">${metrics()}${diffTable()}${scenarioDrawer()}</main>${inspector()}</div>`}
    function variant(){const key=new URLSearchParams(location.search).get("variant")?.toUpperCase();return variants[key]?key:"A"}
    function setVariant(key){const params=new URLSearchParams(location.search);params.set("variant",key);history.replaceState(null,"",`${location.pathname}?${params}`);render()}
    function cycle(direction){const keys=Object.keys(variants),index=keys.indexOf(variant());setVariant(keys[(index+direction+keys.length)%keys.length])}
    function wire(){document.querySelectorAll("[data-select]").forEach(el=>{const select=()=>{state.selected=el.dataset.select;render()};el.addEventListener("click",select);el.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();select()}})});document.getElementById("zoom")?.addEventListener("input",event=>{state.zoom=Number(event.target.value);render()});document.getElementById("critical-toggle")?.addEventListener("click",()=>{state.criticalOnly=!state.criticalOnly;render()});document.getElementById("scenario-concurrency")?.addEventListener("input",event=>{state.scenarioConcurrency=Number(event.target.value);render()})}
    function render(){const key=variant();document.getElementById("variant-name").textContent=`${key} — ${variants[key]}`;document.getElementById("app").innerHTML=key==="A"?traceVariant():key==="B"?graphVariant():diffVariant();wire()}
    document.getElementById("prev").addEventListener("click",()=>cycle(-1));document.getElementById("next").addEventListener("click",()=>cycle(1));window.addEventListener("popstate",render);window.addEventListener("keydown",event=>{if(!["ArrowLeft","ArrowRight"].includes(event.key)||event.target.matches("input,textarea,[contenteditable]"))return;cycle(event.key==="ArrowLeft"?-1:1)});render();
  </script>
</body>
