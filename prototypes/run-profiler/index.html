    function stageEntries(item){if(!item)return[];if(deepAvailable(item))return[{type:"stage",id:`stage:${item.id}:normalization`,stamp:null,group:"normalization",source:"candidate-normalization.json",message:"npx xo --fix · passed · 2.398s",title:"Candidate normalization",fact:"passed",location:"candidate-normalization.json"},{type:"stage",id:`stage:${item.id}:validation-xo`,stamp:null,group:"validation",source:"validation.json · command 0",message:"npx xo index.js · passed · 933ms",title:"Validation · xo",fact:"passed",location:"validation command 0"},{type:"stage",id:`stage:${item.id}:validation-ava`,stamp:null,group:"validation",source:"validation.json · command 1",message:"npx ava · passed · 3.870s · 51 tests",title:"Validation · ava",fact:"51 tests passed",location:"validation command 1"},{type:"stage",id:`stage:${item.id}:apply`,stamp:null,group:"apply",source:"apply-check.json",message:"accepted-state conflict · expected 8a2aeffb… · got 28dc1d3a…",error:true,title:"Apply check · conflict",fact:"apply/check-conflict",location:"apply-check.json"}];return[{type:"stage",id:`stage:${item.id}:outcome`,stamp:null,group:item.fact.startsWith("validation")?"validation":"apply",source:item.source,message:`${item.action} · ${item.fact} · ${item.status}`,error:item.status==="failure",title:`Attempt outcome · ${item.kind}`,fact:`${item.action} / ${item.fact}`,location:item.source}]}
    function eventContextSequences(){const selection=state.selected;if(!selection||selection==="run")return currentRun().events.map(item=>item.seq);if(selection.startsWith("event:")){const context=selectedEventSequences(state.graphNode);return context.length?[...new Set([...context,Number(selection.slice(6))])].sort((a,b)=>a-b):[Number(selection.slice(6))]}if(selection.startsWith("turn:")||selection.startsWith("tool:")||selection.startsWith("obs:"))return eventSequences(completedAttempts[0].event);const sequences=selectedEventSequences(selection);return sequences.length?sequences:currentRun().events.map(item=>item.seq)}
    function groupBy(items,keyOf){return items.reduce((groups,item)=>{const key=keyOf(item);(groups[key]??=[]).push(item);return groups},{})}
    function eventLifecycle(item){if(item.name.includes("attempt-allocated"))return"Allocation";if(item.name.includes("attempt-")||item.name.includes("node-"))return"Worker lifecycle";if(item.name.includes("validation"))return"Validation";if(item.name==="run-finished")return"Completion";return"Run lifecycle"}
    function evidenceEvents(){const wanted=new Set(eventContextSequences());return currentRun().events.filter(item=>wanted.has(item.seq))}
    function eventsPane(){const items=evidenceEvents(),groups=state.variant==="B"?groupBy(items,eventLifecycle):null,body=groups?Object.entries(groups).map(([name,entries])=>`<div class="evidence-group">${name}</div>${entries.map(eventListRow).join("")}`).join(""):items.map(eventListRow).join("");return`<section class="event-pane" aria-label="Structured Events"><div class="pane-head"><div class="pane-title"><h2>Events</h2><small>${state.variant==="B"?"Grouped by lifecycle":"Chronological"} · ${items.length}</small></div></div><div class="event-list">${body||`<div class="log-empty">No Events match this selection.</div>`}</div></section>`}
    function eventListRow(item){return`<button class="event-row-list ${selectedClass(`event:${item.seq}`)}" data-event="${item.seq}"><span class="mono">${fmt(item.time)}</span><span><b>${item.name}</b><small>#${item.seq} · ${item.kind||"recorded"}</small></span></button>`}
    function attemptLogs(item,includeRaw=true){const events=eventSequences(item.event).map(sequence=>currentRun().events.find(event=>event.seq===sequence)).filter(Boolean).map(runEventEntry),raw=includeRaw&&deepAvailable(item)?rawEntries():[];return[...events,attemptSummary(item),...raw,...stageEntries(item)]}
    function logEntries(){const selection=state.selected;if(!selection||selection==="run")return currentRun().events.map(runEventEntry);if(selection.startsWith("event:")){const sequence=Number(selection.slice(6)),event=currentRun().events.find(item=>item.seq===sequence),attempt=associatedAttempt(sequence);return[event&&runEventEntry(event),attempt&&attemptSummary(attempt),...stageEntries(attempt)].filter(Boolean)}if(currentRun().id==="completed"&&selection.startsWith("obs:"))return rawEntries().filter(item=>item.id===selection);if(currentRun().id==="completed"&&selection.startsWith("turn:")){const turn=Number(selection.slice(5));return rawEntries().filter(item=>item.record.turn===turn)}if(currentRun().id==="completed"&&selection.startsWith("tool:")){const tool=tools[Number(selection.slice(5))];return rawEntries().filter(item=>item.record.call===tool.call)}const attempt=currentRun().attempts.find(item=>item.id===selection);if(attempt)return attemptLogs(attempt);if(nodeOrder.includes(selection)){const attempts=currentRun().attempts.filter(item=>item.node===selection);return attempts.flatMap(item=>[attemptSummary(item),...(deepAvailable(item)?[{type:"summary",id:`summary:${item.id}:observability`,stamp:null,group:"worker",source:"worker observability",message:`37 raw records · 6 turns · 8 tool calls · first TTFT ${fmt(turns[0].ttft)} · stdout.log omitted (117MB)`,title:"Worker observability summary",fact:"Partial diagnostic/path-only",location:"observability.jsonl"}]:[]),...stageEntries(item)])}return[]}
    function filterLabel(){if(!state.selected)return"No trace selection";if(state.selected==="run")return"Execution Run";if(state.selected.startsWith("turn:"))return`Worker Turn ${Number(state.selected.slice(5))+1}`;if(state.selected.startsWith("tool:"))return`Tool Invocation · ${tools[Number(state.selected.slice(5))]?.name}`;if(state.selected.startsWith("obs:"))return"Selected raw event";if(state.selected.startsWith("event:"))return`Selected Event · Node context ${nodeLabels[state.graphNode]?.[0]||"Run"}`;return state.selected}
    function logs(){const entries=logEntries(),grouped=state.variant==="B"?groupBy(entries,item=>item.group||"worker"):null,rows=list=>list.map(item=>`<button class="log-row ${state.logSelection===item.id?"selected":""}" data-log="${item.id}"><span>${item.stamp?clock(item.stamp):"—"}</span><span class="source">${item.source}</span><span class="${item.error?"error":""}">${item.message}</span></button>`).join(""),body=grouped?Object.entries(grouped).map(([name,list])=>`<div class="evidence-group">${name}</div>${rows(list)}`).join(""):rows(entries);return`<section class="log-pane ${state.variant==="C"?"console":""}" aria-label="Filtered Logs"><div class="pane-head"><div class="pane-title"><h2>Logs</h2><small>${state.variant==="B"?"Grouped sources":state.variant==="C"?"Filtered console":"Structured stream"} · ${filterLabel()} · ${entries.length}</small></div></div><div class="log-list">${body||`<div class="log-empty">No matching embedded evidence. The authoritative trace envelope remains available.</div>`}</div></section>`}
    function evidence(){return`<div class="evidence" style="--evidence:${state.evidence}%">${eventsPane()}${separator("evidence","Resize Events and Logs","vertical","evidence-split")}${logs()}</div>`}
    function tracePane(){const body=variantA();return`<main class="trace-pane"><div class="pane-head"><div class="pane-title"><h2>Trace evidence · Variant ${state.variant}</h2><small>Inline hierarchy · ${variantNames[state.variant]}</small></div><div class="pane-actions"><label class="inline muted" style="font-size:.54rem">Zoom <input id="zoom" type="range" min="100" max="190" value="${state.zoom}" aria-label="Trace zoom"></label>${maxButton("trace")}</div></div><div class="trace-view"><div class="waterfall" style="--trace-width:${state.zoom}%">${body}${traceLegend()}</div></div>${separator("trace","Resize waterfall and evidence","horizontal","trace-split")}${evidence()}</main>`}

    function aggregateNode(nodeId){const attempts=currentRun().attempts.filter(item=>item.node===nodeId),span=nodeSpan(nodeId);return{attempts:attempts.length,duration:span?span.end-span.start:null,tokens:attempts.reduce((sum,item)=>sum+item.tokens,0),cost:attempts.reduce((sum,item)=>sum+item.cost,0)}}
    function selectionEntity(){if(state.logSelection){const entry=logEntries().find(item=>item.id===state.logSelection);if(entry)return{title:entry.title||entry.message,kind:"Log Evidence",status:entry.error?"error":"recorded",duration:entry.record?.duration??entry.record?.ttft??null,tokens:null,cost:null,ttft:entry.record?.ttft,fact:entry.fact||entry.message,source:entry.source,location:entry.location||entry.source}}if(!state.selected||state.selected==="run")return{title:currentRun().runId,kind:"Execution Run",status:currentRun().outcome,duration:currentRun().duration,tokens:currentRun().tokens,cost:currentRun().cost,fact:`run-finished / ${currentRun().outcome}`,source:"events.jsonl",location:`events 1–${currentRun().eventCount}`};if(state.selected.startsWith("event:")){const seq=Number(state.selected.slice(6)),item=currentRun().events.find(entry=>entry.seq===seq);return{title:`Event ${seq} · ${item.name}`,kind:"Run Event",status:item.kind||"recorded",duration:item.time,tokens:null,cost:null,fact:item.name,source:"events.jsonl",location:`sequence ${seq}`}}if(state.selected.startsWith("turn:")){const turn=turns[Number(state.selected.slice(5))];return{title:`Worker Turn ${turn.index+1}`,kind:"Worker Turn",status:"observed",duration:turn.duration,tokens:null,cost:null,ttft:turn.ttft,tools:tools.filter(item=>item.turn===turn.index).length,fact:"turn_start / turn_end",source:"observability.jsonl",location:`turnIndex ${turn.index}`}}if(state.selected.startsWith("tool:")){const tool=tools[Number(state.selected.slice(5))];return{title:`${tool.name} · ${tool.call}`,kind:"Tool Invocation",status:tool.error?"error":"completed",duration:tool.duration,tokens:null,cost:null,tools:1,fact:tool.error?"tool_end / isError true":"tool_end / isError false",source:"observability.jsonl",location:`turnIndex ${tool.turn}`}}if(state.selected.startsWith("obs:")){const index=Number(state.selected.slice(4)),item=rawObservability[index];return{title:`Record ${index+1} · ${item.event}`,kind:"Raw Observability Event",status:item.error?"error":"recorded",duration:item.duration??item.ttft,tokens:null,cost:null,ttft:item.ttft,fact:item.event,source:"observability.jsonl",location:`record ${index+1} of 37`}}const attempt=attemptById();if(attempt)return{title:attempt.id,kind:`Attempt · ${attempt.kind}`,status:attempt.status==="failure"?"rejected":attempt.action,duration:attempt.duration,tokens:attempt.tokens,cost:attempt.cost,ttft:deepAvailable(attempt)?turns[0].ttft:null,firstOutput:attempt.firstOutput,tools:deepAvailable(attempt)?tools.length:null,toolTime:attempt.tools,turns:attempt.turns,normalization:deepAvailable(attempt)?2398.45:null,validation:deepAvailable(attempt)?4803.179:null,patch:attempt.fact,source:attempt.source,location:attempt.event,fact:attempt.fact};const nodeId=nodeOrder.includes(state.selected)?state.selected:state.graphNode,metrics=aggregateNode(nodeId),span=nodeSpan(nodeId);return{title:nodeLabels[nodeId][0],kind:"DAG Node",status:currentRun().nodeStates[nodeId],duration:metrics.duration,tokens:metrics.tokens||null,cost:metrics.cost||null,attempts:metrics.attempts,fact:`node state / ${currentRun().nodeStates[nodeId]}`,source:"events.jsonl + execution packet",location:`Node ${nodeId}`}}
    function metrics(item){const list=[["Duration",fmt(item.duration)],["TTFT",item.ttft!=null?fmt(item.ttft):"Unavailable"],["First output",item.firstOutput!=null?fmt(item.firstOutput):"Unavailable"],["Tokens",item.tokens!=null?item.tokens.toLocaleString():"Unavailable"],["Cost",item.cost!=null?money(item.cost):"Unavailable"],["Attempts",item.attempts??"Unavailable"],["Worker Turns",item.turns??(item.kind==="Worker Turn"?1:"Unavailable")],["Tool Invocations",item.tools??"Unavailable"],["Tool time",item.toolTime!=null?fmt(item.toolTime):"Unavailable"],["Normalization",item.normalization!=null?fmt(item.normalization):"Unavailable"],["Validation",item.validation!=null?fmt(item.validation):"Unavailable"]];return`<div class="metric-grid">${list.map(([label,value])=>`<div class="metric"><small>${label}</small><b>${value}</b></div>`).join("")}</div>`}
    function observations(){if(currentRun().id==="dry")return[{title:"No Execution Run work was performed",detail:"Dry-run completed after preflight; deep timing and cost are unavailable.",select:"event:3"}];if(currentRun().id==="failed")return[{title:"Runtime failed after three Attempts",detail:"Validation/program-failure exhausted the repair budget.",select:"runtime-abort-grounded:000003"},{title:"Runtime tests was skipped",detail:"Upstream Runtime work did not complete.",select:"runtime-tests-grounded"}];return[{title:"Integration conflict led to one repair",detail:"The original Runtime candidate conflicted with accepted sibling state.",select:deepAttemptId},{title:"Node Validation led to one repair",detail:"Three AVA tests rejected the original Runtime tests candidate.",select:"runtime-tests-grounded:000001"},{title:"Final Validation passed",detail:"The accepted ledger reconstructed and passed 56 tests.",select:"final-validation"}]}
    function evidenceClass(item){if(["Worker Turn","Tool Invocation","Raw Observability Event"].includes(item.kind)||(item.kind==="Log Evidence"&&!item.source?.includes("events.jsonl"))||item.source?.includes("worker")||item.source?.includes("observability"))return"Partial — diagnostic/path-only";if(item.kind.startsWith("Attempt")&&item.ttft!=null)return"Observed outcome + Partial diagnostic path";return`Observed${item.kind==="DAG Node"?" + Derived":""}`}
    function inspector(){const item=selectionEntity(),time=cursorTime();return`<aside class="inspector"><div class="pane-head"><div class="pane-title"><h2>Inspector</h2><small>Selection-linked evidence</small></div>${maxButton("inspector")}</div><section><div class="inline" style="justify-content:space-between"><h3>Selected evidence</h3>${tag(stateType(item.status),item.status)}</div><strong class="mono selected-title">${item.title}</strong><dl style="margin-top:8px"><dt>Kind</dt><dd>${item.kind}</dd><dt>Typed fact</dt><dd class="mono">${item.fact}</dd>${item.patch?`<dt>Patch / apply</dt><dd>${item.patch}</dd>`:""}</dl></section><section><h3>Metrics</h3>${metrics(item)}${item.validation!=null?`<dl style="margin-top:8px"><dt>Validation detail</dt><dd>xo 933.437ms · ava 3,869.742ms</dd><dt>Apply check</dt><dd>Conflict: expected base tree 8a2aeffb…, got 28dc1d3a…</dd></dl>`:""}</section><section><h3>Diagnostic Observations</h3>${observations().map(item=>`<button class="observation" data-select="${item.select}"><b>${item.title}</b><small>${item.detail}</small></button>`).join("")}</section><section class="receipt"><h3>Evidence Receipt</h3><dl><dt>Evidence cursor</dt><dd class="mono">${time==null?"No trace selection":`${fmt(time)} from run start`}</dd><dt>Evidence class</dt><dd>${evidenceClass(item)}</dd><dt>Source</dt><dd class="mono">${item.source}</dd><dt>Location</dt><dd class="mono">${item.location}</dd><dt>Run identity</dt><dd class="mono">${currentRun().runId}</dd><dt>Provenance</dt><dd>Raw local observability is formally classified Partial — diagnostic/path-only. Absolute Run and Attempt facts remain authoritative from events.jsonl and Attempt Outcomes.</dd></dl></section><section><h3>Availability</h3><div class="notice">The completed Runtime original Attempt embeds all 37 raw observability records. Other Attempts honestly retain only their available envelope and outcome evidence in this throwaway prototype.</div></section></aside>`}

    function workspace(){return`<div class="workspace ${state.maximized?`max-${state.maximized}`:""}" style="--left:${state.left}px;--right:${state.right}px;--dag:${state.dag}%;--trace:${state.trace}%">${leftRail()}${separator("left","Resize DAG column","vertical","left-resizer")}${tracePane()}${separator("right","Resize inspector column","vertical","right-resizer")}${inspector()}</div>`}
    function bindSelect(element,update){const select=()=>{update();render()};element.addEventListener("click",select);element.addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&element.tagName!=="BUTTON"){event.preventDefault();select()}})}
    function resizeByKey(kind,delta){if(kind==="left")state.left=Math.max(210,Math.min(480,state.left+delta));if(kind==="right")state.right=Math.max(240,Math.min(500,state.right-delta));if(kind==="dag")state.dag=Math.max(45,Math.min(82,state.dag+delta/4));if(kind==="trace")state.trace=Math.max(35,Math.min(78,state.trace+delta/4));if(kind==="evidence")state.evidence=Math.max(20,Math.min(50,state.evidence+delta/4));render()}
    function startResize(element,event){event.preventDefault();const kind=element.dataset.resize,startX=event.clientX,startY=event.clientY,start={left:state.left,right:state.right,dag:state.dag,trace:state.trace,evidence:state.evidence},workspaceElement=document.querySelector(".workspace"),leftRailElement=document.querySelector(".left-rail"),traceElement=document.querySelector(".trace-pane"),evidenceElement=document.querySelector(".evidence");element.classList.add("dragging");const move=moveEvent=>{if(kind==="left")state.left=Math.max(210,Math.min(480,start.left+moveEvent.clientX-startX));if(kind==="right")state.right=Math.max(240,Math.min(500,start.right-(moveEvent.clientX-startX)));if(kind==="dag")state.dag=Math.max(45,Math.min(82,start.dag+(moveEvent.clientY-startY)/leftRailElement.clientHeight*100));if(kind==="trace")state.trace=Math.max(35,Math.min(78,start.trace+(moveEvent.clientY-startY)/traceElement.clientHeight*100));if(kind==="evidence")state.evidence=Math.max(20,Math.min(50,start.evidence+(moveEvent.clientX-startX)/evidenceElement.clientWidth*100));(kind==="evidence"?evidenceElement:workspaceElement).style.setProperty(`--${kind}`,`${state[kind]}${kind==="left"||kind==="right"?"px":"%"}`)};const end=()=>{element.classList.remove("dragging");window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",end)};window.addEventListener("pointermove",move);window.addEventListener("pointerup",end)}
    function wire(){document.querySelectorAll("[data-run]").forEach(element=>element.addEventListener("click",()=>{state.runId=element.dataset.run;state.selected=null;clearLogSelection();state.graphNode=openNode()||"runtime-abort-grounded";render()}));document.querySelectorAll("[data-select-run]").forEach(element=>element.addEventListener("click",()=>{state.selected="run";clearLogSelection();render()}));document.querySelectorAll("[data-node]").forEach(element=>bindSelect(element,()=>{const node=element.dataset.node;state.graphNode=node;state.selected=node;clearLogSelection();setOpenNode(openNode()===node?null:node)}));document.querySelectorAll("[data-select]").forEach(element=>bindSelect(element,()=>{state.selected=element.dataset.select;clearLogSelection();const node=selectedNodeFor(state.selected);if(node){state.graphNode=node;setOpenNode(node)}}));document.querySelectorAll("[data-event]").forEach(element=>element.addEventListener("click",()=>{const sequence=Number(element.dataset.event),attempt=associatedAttempt(sequence);state.selected=`event:${sequence}`;clearLogSelection();if(attempt){state.graphNode=attempt.node;setOpenNode(attempt.node)}else if(currentRun().id==="completed"&&(sequence===20||sequence===21)){state.graphNode="final-validation";setOpenNode("final-validation")}render()}));document.querySelectorAll("[data-log]").forEach(element=>element.addEventListener("click",()=>{state.logSelection=element.dataset.log;render()}));document.querySelectorAll("[data-maximize]").forEach(element=>element.addEventListener("click",()=>{state.maximized=state.maximized===element.dataset.maximize?null:element.dataset.maximize;render()}));document.querySelectorAll("[data-resize]").forEach(element=>{element.addEventListener("pointerdown",event=>startResize(element,event));element.addEventListener("keydown",event=>{const delta=event.key==="ArrowLeft"||event.key==="ArrowUp"?-12:event.key==="ArrowRight"||event.key==="ArrowDown"?12:0;if(delta){event.preventDefault();resizeByKey(element.dataset.resize,delta)}})});document.getElementById("zoom")?.addEventListener("input",event=>{state.zoom=Number(event.target.value);document.querySelector(".waterfall")?.style.setProperty("--trace-width",`${state.zoom}%`)});document.querySelector("[data-refresh]")?.addEventListener("click",render)}
    function render(){document.getElementById("app").innerHTML=`${topbar()}${runStrip()}${workspace()}`;wire()}
    window.addEventListener("keydown",event=>{if(event.key==="Escape"&&state.maximized){state.maximized=null;render()}});
    render();
  </script>
