<!doctype html>
<!-- Three Attempt 14 waterfall prototypes, switchable via ?variant=A|B|C. PROTOTYPE — do not ship. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fanout Attempt 14 — profiler prototypes</title>
  <style>
    :root{
      color-scheme:light;
      --paper:#f4f6f8;--white:#ffffff;--ink:#17212b;--steel:#667587;--rule:#cbd3dc;--rule-dark:#9ca9b7;
      --signal:#146c94;--signal-light:#dbeef6;--repair:#a56717;--repair-light:#f8ead0;--failure:#b7413e;--failure-light:#f7dfde;
      --success:#28734d;--success-light:#dceee4;--unknown:#7b6d8d;--unknown-light:#ece7f1;
      font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}body{margin:0;min-width:360px;min-height:100vh;background:var(--paper);color:var(--ink)}
    button,input{font:inherit}button{color:inherit}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
    h1,h2,h3,p{margin-top:0}h1{margin-bottom:2px;font-size:1rem;font-weight:650}h2{margin-bottom:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em}h3{margin-bottom:7px;font-size:.74rem}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.muted,small{color:var(--steel)}
    .shell{min-height:100vh;padding-bottom:68px}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 14px;border-bottom:1px solid var(--rule-dark);background:var(--white)}
    .brand,.tools,.inline{display:flex;align-items:center;gap:8px}.mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--ink);font-weight:750}.crumb{font-size:.63rem;color:var(--steel)}
    .button{padding:5px 8px;border:1px solid var(--rule-dark);border-radius:2px;background:var(--white);font-size:.67rem;cursor:pointer}.button:hover,.button.active{border-color:var(--signal);background:var(--signal-light)}.button.quiet{background:transparent}
    .tag{display:inline-flex;align-items:center;padding:2px 5px;border:1px solid var(--rule-dark);border-radius:2px;background:var(--white);font-size:.58rem;line-height:1.25;white-space:nowrap}.tag.observed{border-color:#6c9e82;color:var(--success);background:var(--success-light)}.tag.derived{border-color:#7caec2;color:var(--signal);background:var(--signal-light)}.tag.repair{border-color:#bf934e;color:#80500e;background:var(--repair-light)}.tag.failure{border-color:#c97975;color:#8c302d;background:var(--failure-light)}.tag.partial{border-color:#a89db5;color:#655774;background:var(--unknown-light)}
    .run-strip{display:grid;grid-template-columns:minmax(210px,1.5fr) repeat(5,minmax(100px,1fr));border-bottom:1px solid var(--rule-dark);background:var(--white)}.run-strip>div{min-height:57px;padding:8px 10px;border-right:1px solid var(--rule)}.run-strip>div:last-child{border-right:0}.run-strip small,.run-strip b{display:block}.run-strip b{margin-top:3px;font-size:.86rem}.run-title b{font-size:.74rem}.run-title .mono{font-size:.61rem;color:var(--steel)}
    .switcher{position:fixed;z-index:100;left:50%;bottom:13px;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:4px;border:1px solid var(--ink);border-radius:3px;background:var(--white);box-shadow:0 6px 18px #17212b2b}.switcher button{width:31px;height:28px;border:0;background:var(--paper);cursor:pointer}.switcher button:hover{background:var(--signal-light)}.switcher strong{min-width:220px;padding:0 10px;text-align:center;font-size:.67rem}
    .section{border-bottom:1px solid var(--rule-dark);background:var(--white)}.section-head{min-height:37px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid var(--rule)}.section-head h2,.section-head h3{margin:0}.notice{padding:7px 9px;border-left:3px solid var(--unknown);background:var(--unknown-light);font-size:.64rem;line-height:1.4}.notice.failure{border-color:var(--failure);background:var(--failure-light)}
    .inspector{display:grid;align-content:start;background:var(--white)}.inspector>section{padding:10px;border-bottom:1px solid var(--rule)}.inspector dl{display:grid;grid-template-columns:92px 1fr;gap:6px 8px;margin:0;font-size:.63rem}.inspector dt{color:var(--steel)}.inspector dd{margin:0;overflow-wrap:anywhere}.inspector .receipt{border-left:3px solid var(--signal)}
    .observation{width:100%;display:block;padding:7px;border:1px solid var(--rule);border-radius:2px;background:var(--white);text-align:left;cursor:pointer}.observation+.observation{margin-top:6px}.observation:hover{border-color:var(--signal)}.observation b,.observation small{display:block}.observation b{font-size:.64rem;margin-bottom:2px}.observation small{font-size:.59rem;line-height:1.35}

    /* Shared waterfall */
    .waterfall-scroll{overflow:auto;background:var(--white)}.waterfall{min-width:760px;width:var(--trace-width,100%)}.axis,.trace-row{display:grid;grid-template-columns:225px minmax(535px,1fr)}.axis{position:sticky;top:0;z-index:6;border-bottom:1px solid var(--rule-dark);background:var(--white)}.axis-label{padding:7px 9px;border-right:1px solid var(--rule);font-size:.59rem;color:var(--steel)}.axis-track,.trace-track{position:relative;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),#e4e8ed calc(12.5% - 1px),#e4e8ed 12.5%)}.axis-track{height:29px}.tick{position:absolute;top:7px;transform:translateX(-50%);font-size:.56rem;color:var(--steel)}
    .trace-row{min-height:39px;border-bottom:1px solid #e7ebef}.trace-row:hover,.trace-row.selected{background:#edf6fa}.trace-label{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:5px 8px;border:0;border-right:1px solid var(--rule);background:transparent;text-align:left;cursor:pointer}.trace-label b,.trace-label small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trace-label b{font-size:.64rem}.trace-label small{font-size:.56rem}.trace-label .indent{padding-left:var(--indent,0)}.trace-track{min-height:39px}
    .attempt-bar{position:absolute;top:8px;height:22px;min-width:4px;padding:0;border:1px solid #2f7392;border-radius:2px;background:var(--signal-light);cursor:pointer;overflow:hidden}.attempt-bar:hover,.trace-row.selected .attempt-bar{outline:2px solid #146c9445;outline-offset:1px}.attempt-bar.repair{border-color:var(--repair);background:var(--repair-light)}.attempt-bar.failure{border-color:var(--failure);background:var(--failure-light)}.attempt-bar.final{border-color:var(--success);background:var(--success-light)}.attempt-bar .duration-share{position:absolute;inset:0 auto 0 0;background:#146c9424;border-right:1px dotted var(--signal)}.attempt-bar.repair .duration-share{background:#a5671724;border-color:var(--repair)}.attempt-bar.failure .duration-share{background:#b7413e24;border-color:var(--failure)}.attempt-bar .bar-text{position:absolute;z-index:1;left:5px;top:3px;font-size:.56rem;white-space:nowrap}.event-pin{position:absolute;top:3px;bottom:3px;width:1px;background:var(--failure)}.event-pin::before{content:"";position:absolute;left:-3px;top:-1px;width:7px;height:7px;background:var(--failure);transform:rotate(45deg)}
    .evidence-cursor{position:absolute;z-index:4;top:0;bottom:0;width:1px;background:var(--signal);pointer-events:none}.evidence-cursor::before{content:"";position:absolute;left:-3px;top:0;width:7px;height:7px;border-radius:50%;background:var(--signal)}.cursor-label{position:absolute;top:1px;left:4px;padding:1px 3px;background:var(--signal);color:white;font-size:.5rem;white-space:nowrap}.legend{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid var(--rule);font-size:.58rem;color:var(--steel)}.key{width:10px;height:8px;display:inline-block;margin-right:4px;border:1px solid var(--signal);background:var(--signal-light)}.key.repair{border-color:var(--repair);background:var(--repair-light)}.key.failure{border-color:var(--failure);background:var(--failure-light)}.key.cursor{width:1px;border:0;background:var(--signal)}

    /* A — Trace desk */
    .desk{display:grid;grid-template-columns:minmax(760px,1fr) 300px;min-height:calc(100vh - 114px)}.desk-main{min-width:0;border-right:1px solid var(--rule-dark)}.trace-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-bottom:1px solid var(--rule)}.zoom{display:flex;align-items:center;gap:6px;font-size:.61rem;color:var(--steel)}.zoom input{width:90px;accent-color:var(--signal)}

    /* B — Graph + trace */
    .graph-trace{display:grid;grid-template-columns:minmax(720px,1fr) 300px;min-height:calc(100vh - 114px)}.graph-main{min-width:0;border-right:1px solid var(--rule-dark)}.dag-wrap{height:270px;overflow:auto;background:var(--white)}.dag-wrap svg{display:block;min-width:760px;width:100%;height:100%}.edge{fill:none;stroke:var(--rule-dark);stroke-width:1.5}.edge.active{stroke:var(--signal);stroke-width:2.5}.node rect{fill:var(--white);stroke:var(--rule-dark);stroke-width:1.2}.node:hover rect,.node.selected rect{fill:var(--signal-light);stroke:var(--signal);stroke-width:2}.node text{fill:var(--ink);font-size:11px}.node .sub{fill:var(--steel);font-size:8px}.node .node-status{stroke:none;fill:var(--success)}.node.repaired .node-status{fill:var(--repair)}.node .critical{fill:var(--failure);stroke:none}.graph-explain{position:absolute;left:10px;top:10px;width:215px;padding:7px;border:1px solid var(--rule);background:#ffffffed;font-size:.61rem;line-height:1.4}.graph-stage{position:relative}.filtered-trace{border-top:1px solid var(--rule-dark)}

    /* C — Repair lens */
    .repair-layout{display:grid;grid-template-columns:minmax(780px,1fr) 300px;min-height:calc(100vh - 114px)}.repair-main{min-width:0;border-right:1px solid var(--rule-dark)}.chain-grid{display:grid;grid-template-columns:160px 1fr 34px 1fr 34px 1fr;border-bottom:1px solid var(--rule)}.chain-grid>div{min-height:78px;padding:9px;border-right:1px solid var(--rule)}.chain-grid>div:last-child{border-right:0}.chain-title b,.chain-title small,.chain-step b,.chain-step small{display:block}.chain-title b,.chain-step b{font-size:.65rem}.chain-title small,.chain-step small{font-size:.57rem;line-height:1.35}.chain-step.failure{background:var(--failure-light)}.chain-step.repair{background:var(--repair-light)}.chain-step.success{background:var(--success-light)}.chain-arrow{display:grid;place-items:center;color:var(--steel);font-size:1rem}.evidence-table{width:100%;border-collapse:collapse;font-size:.61rem}.evidence-table th,.evidence-table td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}.evidence-table th{color:var(--steel);font-weight:500;background:var(--paper)}.evidence-table tr[data-select]{cursor:pointer}.evidence-table tr[data-select]:hover,.evidence-table tr.selected{background:var(--signal-light)}

    @media(max-width:980px){.desk,.graph-trace,.repair-layout{grid-template-columns:1fr}.desk-main,.graph-main,.repair-main{border-right:0}.inspector{grid-template-columns:1fr 1fr;border-top:1px solid var(--rule-dark)}.run-strip{overflow:auto}.tools .optional{display:none}}
    @media(max-width:680px){.topbar .tools{display:none}.run-strip{display:flex}.run-strip>div{min-width:120px}.run-strip>.run-title{min-width:225px}.inspector{grid-template-columns:1fr}.switcher strong{min-width:175px}.chain-grid{grid-template-columns:120px 1fr}.chain-arrow{display:none}.chain-grid>div{min-height:68px}.axis,.trace-row{grid-template-columns:180px minmax(580px,1fr)}}
  </style>
</head>
<body>
  <div id="app" class="shell"></div>
  <nav class="switcher" aria-label="Prototype variants"><button id="previous" aria-label="Previous prototype">←</button><strong id="variant-label"></strong><button id="next" aria-label="Next prototype">→</button></nav>
  <script>
    const variants={A:"Trace Desk",B:"Graph + Trace",C:"Repair Lens"};
    const totalMs=465391;
    const state={selected:"runtime-abort-grounded:000001",zoom:115,graphNode:"runtime-abort-grounded"};
    const attempts=[
      {id:"runtime-abort-grounded:000001",node:"runtime-abort-grounded",label:"Attempt 1 · original",kind:"original",start:22745,end:148359,duration:125614,worker:117256.518,tools:111.472,turns:6,tokens:116494,cost:.171074,action:"integration-repair",fact:"apply / check-conflict",event:"events 4, 11",status:"failure",source:"workers/runtime-abort-grounded-d8cf4e94/attempts/001-original/attempt-outcome.json"},
      {id:"types-abort-grounded:000001",node:"types-abort-grounded",label:"Attempt 1 · original",kind:"original",start:22745,end:49176,duration:26431,worker:21465.65,tools:66.121,turns:5,tokens:56702,cost:.079035,action:"accept",fact:"apply / applied",event:"events 5–7",status:"success",source:"workers/types-abort-grounded-9d25d079/attempts/001-original/attempt-outcome.json"},
      {id:"docs-abort-grounded:000001",node:"docs-abort-grounded",label:"Attempt 1 · original",kind:"original",start:49178,end:66509,duration:17331,worker:14291.641,tools:17.025,turns:3,tokens:32693,cost:.043746,action:"accept",fact:"apply / applied",event:"events 8–10",status:"success",source:"workers/docs-abort-grounded-8e6c6f18/attempts/001-original/attempt-outcome.json"},
      {id:"runtime-abort-grounded:000002",node:"runtime-abort-grounded",label:"Attempt 2 · integration repair",kind:"integration-repair",start:148361,end:293215,duration:144853,worker:135313.782,tools:254.267,turns:9,tokens:215783,cost:.438847,action:"accept",fact:"apply / applied",event:"events 12–14",status:"repair",source:"workers/runtime-abort-grounded-d8cf4e94/attempts/002-integration-repair/attempt-outcome.json"},
      {id:"runtime-tests-grounded:000001",node:"runtime-tests-grounded",label:"Attempt 1 · original",kind:"original",start:293218,end:421145,duration:127925,worker:120369.985,tools:125.824,turns:7,tokens:144818,cost:.2350575,action:"validation-repair",fact:"validation / program-failure",event:"events 15–16",status:"failure",source:"workers/runtime-tests-grounded-49ed6411/attempts/001-original/attempt-outcome.json"},
      {id:"runtime-tests-grounded:000002",node:"runtime-tests-grounded",label:"Attempt 2 · validation repair",kind:"validation-repair",start:421148,end:456820,duration:35672,worker:28072.563,tools:152.402,turns:5,tokens:88591,cost:.170643,action:"accept",fact:"apply / applied",event:"events 17–19",status:"repair",source:"workers/runtime-tests-grounded-49ed6411/attempts/002-validation-repair/attempt-outcome.json"},
    ];
    const nodes=[
      {id:"runtime-abort-grounded",label:"Runtime",detail:"index.js",status:"repaired",start:22745,end:293216},
      {id:"types-abort-grounded",label:"Types",detail:"index.d.ts · index.test-d.ts",status:"success",start:22745,end:49178},
      {id:"docs-abort-grounded",label:"Docs",detail:"readme.md",status:"success",start:49178,end:66510},
      {id:"runtime-tests-grounded",label:"Runtime tests",detail:"test.js",status:"repaired",start:293218,end:456822},
      {id:"final-validation",label:"Final validation",detail:"npm test · 56 passed",status:"success",start:456824,end:465388},
    ];
    function validateFixture(){const tokens=attempts.reduce((sum,item)=>sum+item.tokens,0);const cost=attempts.reduce((sum,item)=>sum+item.cost,0);if(attempts.length!==6||tokens!==655081||Math.abs(cost-1.1384025)>.0000001||totalMs!==465391)throw new Error("Attempt 14 fixture totals drifted")}
    validateFixture();
    function pct(ms){return ms/totalMs*100}function duration(ms){if(ms<1000)return `${ms.toFixed(0)}ms`;const seconds=ms/1000;if(seconds<60)return `${seconds.toFixed(1)}s`;return `${Math.floor(seconds/60)}m ${Math.round(seconds%60)}s`}function money(value){return `$${value.toFixed(value<.1?3:4)}`}
    function tag(type,label){return `<span class="tag ${type}">${label}</span>`}
    function topbar(){return `<header class="topbar"><div class="brand"><div class="mark">F</div><div><h1>Fanout run profiler ${tag("","PROTOTYPE")}</h1><div class="crumb mono">p-map AbortSignal canary / Attempt 14 / 2026-07-14T10-17-57-391Z-5895ab5f</div></div></div><div class="tools">${tag("observed","event-v2 · verified")}${tag("","read only")}<button class="button quiet optional">Choose artifact root</button><button class="button">Refresh</button></div></header>`}
    function runStrip(){return `<section class="run-strip"><div class="run-title"><small>Execution Run</small><b>Attempt 14 · completed</b><span class="mono">22 events · packet v6 · projection v3</span></div><div><small>Wall time</small><b>7m 45.391s</b><span class="muted mono" style="font-size:.56rem">observed</span></div><div><small>Attempts</small><b>6</b><span class="muted mono" style="font-size:.56rem">4 original · 2 repair</span></div><div><small>Tokens</small><b>655,081</b><span class="muted mono" style="font-size:.56rem">observed</span></div><div><small>Cost</small><b>$1.1384025</b><span class="muted mono" style="font-size:.56rem">estimated</span></div><div><small>Final validation</small><b>7.029s</b><span class="muted mono" style="font-size:.56rem">56 tests passed</span></div></section>`}
    function selectedAttempt(){return attempts.find(item=>item.id===state.selected)}
    function selectedEntity(){const attempt=selectedAttempt();if(attempt)return {title:attempt.id,kind:attempt.kind,status:attempt.status==="failure"?"rejected":attempt.action,duration:duration(attempt.duration),cost:money(attempt.cost),tokens:attempt.tokens.toLocaleString(),source:attempt.source,event:attempt.event,fact:attempt.fact};const node=nodes.find(item=>item.id===state.selected)||nodes.find(item=>item.id===state.graphNode);return {title:node.label,kind:"DAG Node",status:node.status,duration:duration(node.end-node.start),cost:"See Attempts",tokens:"See Attempts",source:"events.jsonl",event:`node events for ${node.id}`,fact:node.status}}
    function inspector(){const item=selectedEntity();return `<aside class="inspector"><section><div class="inline" style="justify-content:space-between"><h2 style="margin:0">Selection</h2>${tag(item.status==="rejected"?"failure":item.status.includes("repair")?"repair":"observed",item.status)}</div><h3 class="mono" style="margin-top:9px">${item.title}</h3><dl><dt>Kind</dt><dd>${item.kind}</dd><dt>Duration</dt><dd>${item.duration}</dd><dt>Tokens</dt><dd>${item.tokens}</dd><dt>Cost</dt><dd>${item.cost}</dd><dt>Typed fact</dt><dd class="mono">${item.fact}</dd></dl></section><section class="receipt"><h2>Evidence receipt</h2><dl><dt>Class</dt><dd>Observed</dd><dt>Generation</dt><dd>packet-v6 / event-v2 / projection-v3</dd><dt>Source</dt><dd class="mono">${item.source}</dd><dt>Location</dt><dd class="mono">${item.event}</dd><dt>Run identity</dt><dd class="mono">5895ab5f</dd></dl></section><section><h2>Diagnostic observations</h2><button class="observation" data-select="runtime-abort-grounded:000001"><b>Integration conflict led to one repair</b><small>The original Runtime output was rejected after accepted sibling changes.</small></button><button class="observation" data-select="runtime-tests-grounded:000001"><b>Node Validation led to one repair</b><small>Three AVA tests rejected the original Runtime tests candidate.</small></button><div class="observation"><b>Worker and tool intervals are unavailable</b><small>Duration shares are shown without claiming absolute placement.</small></div></section></aside>`}
    const tickValues=[0,60000,120000,180000,240000,300000,360000,420000,465391];
    function axis(cursor){return `<div class="axis"><div class="axis-label">Attempt envelope · relative wall time</div><div class="axis-track">${tickValues.map(ms=>`<span class="tick" style="left:${pct(ms)}%">${ms===465391?"7:45":`${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,"0")}`}</span>`).join("")}${cursor!==undefined?`<span class="evidence-cursor" style="left:${pct(cursor)}%"><span class="cursor-label">${duration(cursor)}</span></span>`:""}</div></div>`}
    function cursorTime(){const attempt=selectedAttempt();if(attempt)return attempt.end;const node=nodes.find(item=>item.id===state.selected);return node?.end??0}
    function rowCursor(){return `<span class="evidence-cursor" style="left:${pct(cursorTime())}%"></span>`}
    function attemptRow(attempt,indent=0){const selected=state.selected===attempt.id;return `<div class="trace-row ${selected?"selected":""}"><button class="trace-label" data-select="${attempt.id}"><span class="indent" style="--indent:${indent}px"><b>${attempt.label}</b><small>${attempt.node}</small></span>${tag(attempt.status==="failure"?"failure":attempt.status==="repair"?"repair":"observed",duration(attempt.duration))}</button><div class="trace-track"><button class="attempt-bar ${attempt.status}" data-select="${attempt.id}" style="left:${pct(attempt.start)}%;width:${Math.max(pct(attempt.duration),.55)}%" aria-label="${attempt.label}, ${duration(attempt.duration)}"><span class="duration-share" style="width:${attempt.worker/attempt.duration*100}%" title="Worker duration share; not an absolute interval"></span><span class="bar-text">${attempt.turns} turns · ${attempt.tokens.toLocaleString()} tok</span></button>${attempt.status==="failure"?`<span class="event-pin" style="left:${pct(attempt.end)}%" title="${attempt.fact}"></span>`:""}${rowCursor()}</div></div>`}
    function finalRow(){const node=nodes.at(-1);return `<div class="trace-row ${state.selected===node.id?"selected":""}"><button class="trace-label" data-select="${node.id}"><span><b>Final Validation</b><small>npm test · 56 tests passed</small></span>${tag("observed","7.029s")}</button><div class="trace-track"><button class="attempt-bar final" data-select="${node.id}" style="left:${pct(node.start)}%;width:${pct(node.end-node.start)}%"><span class="bar-text">passed</span></button>${rowCursor()}</div></div>`}
    function fullTrace(){const groups=["runtime-abort-grounded","types-abort-grounded","docs-abort-grounded","runtime-tests-grounded"];return `<div class="waterfall-scroll"><div class="waterfall" style="--trace-width:${state.zoom}%">${axis(cursorTime())}${groups.map(nodeId=>{const node=nodes.find(n=>n.id===nodeId);const children=attempts.filter(a=>a.node===nodeId);return `<div class="trace-row ${state.selected===nodeId?"selected":""}"><button class="trace-label" data-select="${nodeId}"><span><b>${node.label}</b><small>${node.detail}</small></span>${tag(node.status==="repaired"?"repair":"observed",node.status)}</button><div class="trace-track">${rowCursor()}</div></div>${children.map(a=>attemptRow(a,16)).join("")}`}).join("")}${finalRow()}</div></div>`}
    function legend(){return `<div class="legend"><span><i class="key"></i>accepted Attempt</span><span><i class="key repair"></i>repair Attempt</span><span><i class="key failure"></i>rejected Attempt</span><span><i class="key cursor"></i>evidence cursor</span><span>shaded bar fill = worker-duration share, not an absolute interval</span>${tag("partial","sub-lane positions unavailable")}</div>`}
    function traceDesk(){return `${topbar()}${runStrip()}<div class="desk"><main class="desk-main"><div class="trace-tools"><div><h2 style="margin:0">Trace Desk</h2><small>Click an Attempt to move the evidence cursor and inspect its receipt.</small></div><label class="zoom">Zoom <input id="zoom" type="range" min="100" max="220" value="${state.zoom}"></label></div>${fullTrace()}${legend()}</main>${inspector()}</div>`}
    function dagNode(id,x,y,w,label,sub,status){const selected=state.graphNode===id;return `<g class="node ${status==="repaired"?"repaired":""} ${selected?"selected":""}" data-node="${id}" role="button" tabindex="0"><rect x="${x}" y="${y}" width="${w}" height="54"/><rect class="node-status" x="${x}" y="${y}" width="5" height="54"/>${id==="runtime-abort-grounded"||id==="runtime-tests-grounded"?`<rect class="critical" x="${x+10}" y="${y+49}" width="${w-20}" height="3"/>`:""}<text x="${x+14}" y="${y+22}">${label}</text><text class="sub" x="${x+14}" y="${y+39}">${sub}</text></g>`}
    function graphSvg(){return `<svg viewBox="0 0 940 260" role="img" aria-label="Static interactive Attempt 14 DAG"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca9b7"/></marker></defs><path class="edge ${state.graphNode==="runtime-abort-grounded"||state.graphNode==="runtime-tests-grounded"?"active":""}" marker-end="url(#arrow)" d="M390 67 C430 67 430 104 470 104"/><path class="edge ${state.graphNode==="runtime-tests-grounded"||state.graphNode==="final-validation"?"active":""}" marker-end="url(#arrow)" d="M650 104 C695 104 695 130 740 130"/><path class="edge ${state.graphNode==="types-abort-grounded"||state.graphNode==="final-validation"?"active":""}" marker-end="url(#arrow)" d="M390 135 C560 135 570 130 740 130"/><path class="edge ${state.graphNode==="docs-abort-grounded"||state.graphNode==="final-validation"?"active":""}" marker-end="url(#arrow)" d="M390 203 C560 203 570 130 740 130"/>${dagNode("runtime-abort-grounded",210,40,180,"Runtime","2 Attempts · repaired","repaired")}${dagNode("types-abort-grounded",210,108,180,"Types","1 Attempt · accepted","success")}${dagNode("docs-abort-grounded",210,176,180,"Docs","1 Attempt · accepted","success")}${dagNode("runtime-tests-grounded",470,77,180,"Runtime tests","2 Attempts · repaired","repaired")}${dagNode("final-validation",740,103,170,"Final validation","npm test · passed","success")}<text x="32" y="58" fill="#667587" font-size="10">Ready at confirmation</text><path d="M130 62H195" class="edge" marker-end="url(#arrow)"/><path d="M130 130H195" class="edge" marker-end="url(#arrow)"/><path d="M130 198H195" class="edge" marker-end="url(#arrow)"/><text x="430" y="55" fill="#667587" font-size="9">post-change read</text></svg>`}
    function filteredTrace(){const filtered=state.graphNode==="final-validation"?[]:attempts.filter(a=>a.node===state.graphNode);return `<section class="filtered-trace"><div class="section-head"><div><h2>Observed schedule · ${nodes.find(n=>n.id===state.graphNode)?.label}</h2><small>Graph topology above; absolute Attempt envelopes below.</small></div>${tag("derived","graph + observed time")}</div><div class="waterfall-scroll"><div class="waterfall">${axis(cursorTime())}${filtered.map(a=>attemptRow(a)).join("")}${state.graphNode==="final-validation"?finalRow():""}</div></div>${legend()}</section>`}
    function graphTrace(){return `${topbar()}${runStrip()}<div class="graph-trace"><main class="graph-main"><section class="section"><div class="section-head"><div><h2>Static execution graph</h2><small>Select a node; the graph stays fixed while its trace filters below.</small></div>${tag("derived","Work Contract graph")}</div><div class="graph-stage"><div class="graph-explain">Edges encode scheduling dependencies. Node color records outcome. The red baseline marks the observed causal chain containing both repairs.</div><div class="dag-wrap">${graphSvg()}</div></div></section>${filteredTrace()}</main>${inspector()}</div>`}
    function chain(nodeId,title,failure,repair){const a=attempts.find(x=>x.id===failure),b=attempts.find(x=>x.id===repair);return `<div class="chain-grid"><div class="chain-title"><b>${title}</b><small class="mono">${nodeId}</small></div><div class="chain-step failure"><b>Original · ${duration(a.duration)}</b><small>${a.fact}<br>${money(a.cost)} · ${a.tokens.toLocaleString()} tokens</small></div><div class="chain-arrow">→</div><div class="chain-step repair"><b>${b.kind.replace("-"," ")} · ${duration(b.duration)}</b><small>Source: ${a.id}<br>${money(b.cost)} · ${b.tokens.toLocaleString()} tokens</small></div><div class="chain-arrow">→</div><div class="chain-step success"><b>Accepted</b><small>${b.fact}<br>Accepted-State Transition recorded</small></div></div>`}
    function repairTable(){const repairAttempts=attempts.filter(a=>a.status!=="success");return `<table class="evidence-table"><thead><tr><th>Attempt</th><th>Kind</th><th>Envelope</th><th>Worker duration</th><th>Tools</th><th>Turns</th><th>Tokens</th><th>Cost</th><th>Action</th></tr></thead><tbody>${repairAttempts.map(a=>`<tr data-select="${a.id}" class="${state.selected===a.id?"selected":""}"><td class="mono">${a.id}</td><td>${a.kind}</td><td>${duration(a.duration)}</td><td>${duration(a.worker)}</td><td>${duration(a.tools)}</td><td>${a.turns}</td><td>${a.tokens.toLocaleString()}</td><td>${money(a.cost)}</td><td>${a.action}</td></tr>`).join("")}</tbody></table>`}
    function repairTrace(){const chosen=attempts.filter(a=>a.node==="runtime-abort-grounded"||a.node==="runtime-tests-grounded");return `<div class="waterfall-scroll"><div class="waterfall">${axis(cursorTime())}${chosen.map(a=>attemptRow(a)).join("")}${finalRow()}</div></div>`}
    function repairLens(){return `${topbar()}${runStrip()}<div class="repair-layout"><main class="repair-main"><section class="section"><div class="section-head"><div><h2>Repair Lens</h2><small>Two typed failure-to-acceptance chains account for four of six Attempts.</small></div>${tag("observed","2 repair chains")}</div>${chain("runtime-abort-grounded","Integration chain","runtime-abort-grounded:000001","runtime-abort-grounded:000002")}${chain("runtime-tests-grounded","Validation chain","runtime-tests-grounded:000001","runtime-tests-grounded:000002")}</section><section class="section"><div class="section-head"><h2>Chains on wall time</h2>${tag("partial","duration-only sub-lanes")}</div>${repairTrace()}${legend()}</section><section class="section"><div class="section-head"><h2>Attempt evidence ledger</h2><small>Exact observed values from Attempt Outcomes.</small></div><div style="overflow:auto">${repairTable()}</div></section></main>${inspector()}</div>`}
    function currentVariant(){const key=new URLSearchParams(location.search).get("variant")?.toUpperCase();return variants[key]?key:"A"}
    function setVariant(key){const params=new URLSearchParams(location.search);params.set("variant",key);history.replaceState(null,"",`${location.pathname}?${params}`);render()}
    function cycle(direction){const keys=Object.keys(variants),index=keys.indexOf(currentVariant());setVariant(keys[(index+direction+keys.length)%keys.length])}
    function wire(){document.querySelectorAll("[data-select]").forEach(element=>{const select=()=>{state.selected=element.dataset.select;const attempt=selectedAttempt();if(attempt)state.graphNode=attempt.node;render()};element.addEventListener("click",select);element.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();select()}})});document.querySelectorAll("[data-node]").forEach(element=>{const select=()=>{state.graphNode=element.dataset.node;state.selected=element.dataset.node;render()};element.addEventListener("click",select);element.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();select()}})});document.getElementById("zoom")?.addEventListener("input",event=>{state.zoom=Number(event.target.value);render()})}
    function render(){const key=currentVariant();document.getElementById("variant-label").textContent=`${key} — ${variants[key]}`;document.getElementById("app").innerHTML=key==="A"?traceDesk():key==="B"?graphTrace():repairLens();wire()}
    document.getElementById("previous").addEventListener("click",()=>cycle(-1));document.getElementById("next").addEventListener("click",()=>cycle(1));window.addEventListener("popstate",render);window.addEventListener("keydown",event=>{if(!["ArrowLeft","ArrowRight"].includes(event.key)||event.target.matches("input,textarea,[contenteditable]"))return;cycle(event.key==="ArrowLeft"?-1:1)});render();
  </script>
</body>
</html>
