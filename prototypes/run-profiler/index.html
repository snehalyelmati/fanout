    function recentRuns(){return `<section class="recent"><div class="pane-head"><div><h2>Recent runs</h2><small>Project · newest first</small></div></div><div class="run-list">${runs.map(item=>`<button class="run-row ${state.runId===item.id?"selected":""}" data-run="${item.id}"><span><b>${new Date(item.started).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})} · ${item.mode}</b><small class="mono">${item.runId.slice(-8)} · ${item.eventCount} events</small></span><span class="run-meta">${tag(item.outcome==="failed"?"failure":item.mode==="dry-run"?"partial":"observed",item.outcome)}<small>${fmt(item.duration)}</small></span></button>`).join("")}</div></section>`}
    function dagNode(id,x,y,w){const [label,sub]=nodeLabels[id],status=run().nodeStates[id],selected=state.graphNode===id;return `<g class="node ${status} ${selected?"selected":""}" data-node="${id}" role="button" tabindex="0"><rect x="${x}" y="${y}" width="${w}" height="48" rx="1"/><rect class="status" x="${x}" y="${y}" width="5" height="48"/><text x="${x+12}" y="${y+20}">${label}</text><text class="sub" x="${x+12}" y="${y+35}">${status} · ${sub}</text></g>`}
    function dag(){const active=(...ids)=>ids.includes(state.graphNode)?"active":"";return `<section class="dag-section"><div class="pane-head"><div><h2>Execution DAG</h2><small>Vertical · select a Node</small></div><div class="pane-actions">${tag("derived","packet graph")}${maxButton("dag")}</div></div><div class="dag-stage"><svg viewBox="0 0 260 405" role="img" aria-label="Vertical static interactive execution DAG"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca9b7"/></marker></defs><path class="edge ${active("runtime-abort-grounded","runtime-tests-grounded")}" marker-end="url(#arrow)" d="M65 73V165"/><path class="edge ${active("runtime-tests-grounded","final-validation")}" marker-end="url(#arrow)" d="M65 213C65 260 130 250 130 292"/><path class="edge ${active("types-abort-grounded","final-validation")}" marker-end="url(#arrow)" d="M195 73V255C195 278 165 278 165 292"/><path class="edge ${active("docs-abort-grounded","final-validation")}" marker-end="url(#arrow)" d="M195 151V255C195 278 165 278 165 292"/>${dagNode("runtime-abort-grounded",10,25,110)}${dagNode("types-abort-grounded",140,25,110)}${dagNode("docs-abort-grounded",140,103,110)}${dagNode("runtime-tests-grounded",10,165,110)}${dagNode("final-validation",70,292,120)}<text x="130" y="379" text-anchor="middle" fill="#687789" font-size="8">Color records this run's observed Node state.</text></svg></div></section>`}
    function leftRail(){return `<aside class="left-rail">${dag()}${recentRuns()}</aside>`}
    function ticks(){return Array.from({length:9},(_,index)=>run().duration*index/8)}function axis(){return `<div class="axis"><div class="axis-label">Relative wall time</div><div class="axis-track">${ticks().map((time,index)=>`<span class="tick" style="left:${index*12.5}%">${fmt(time)}</span>`).join("")}${cursor(true)}</div></div>`}
    function cursor(label=false){const time=cursorTime();return `<span class="cursor" style="left:${pct(time)}%">${label?`<span class="cursor-label">${fmt(time)}</span>`:""}</span>`}
    function cursorTime(){if(state.selected.startsWith("event:")){const sequence=Number(state.selected.split(":")[1]);return run().events.find(item=>item.seq===sequence)?.time??0}const attempt=run().attempts.find(item=>item.id===state.selected);if(attempt)return attempt.end;const span=nodeSpan(state.selected);return span?.end??run().duration}
    function nodeSpan(nodeId){if(nodeId==="final-validation"){if(run().id!=="completed")return null;return{start:456824,end:465388,status:"success"}}const related=run().attempts.filter(item=>item.node===nodeId);if(!related.length)return null;const nodeState=run().nodeStates[nodeId];return{start:Math.min(...related.map(item=>item.start)),end:Math.max(...related.map(item=>item.end)),status:nodeState==="repaired"?"repair":nodeState==="failed"?"failure":"success"}}
    function bar(start,end,status,label,id,worker){return `<button class="bar ${status}" data-select="${id}" style="left:${pct(start)}%;width:${Math.max(pct(end-start),.5)}%" aria-label="${label}, ${fmt(end-start)}">${worker===undefined?"":`<span class="worker-share" style="width:${worker/(end-start)*100}%" title="Worker duration share; not wall-clock aligned"></span>`}<span class="bar-text">${label}</span></button>`}
    function traceRow(label,sub,id,status,content,indent=0){return `<div class="trace-row ${state.selected===id||state.graphNode===id?"selected":""}"><button class="trace-label" data-select="${id}"><span class="indent" style="--indent:${indent}px"><b>${label}</b><small>${sub}</small></span>${tag(status==="failure"?"failure":status==="repair"?"repair":status==="partial"?"partial":"observed",status)}</button><div class="track ${content?"":"empty"}">${content||"No observed execution envelope"}${cursor()}</div></div>`}
    function nodeRows(){return nodeOrder.map(nodeId=>{const [label,sub]=nodeLabels[nodeId],span=nodeSpan(nodeId),status=run().nodeStates[nodeId];return traceRow(label,sub,nodeId,status,span?bar(span.start,span.end,span.status,fmt(span.end-span.start),nodeId):"" )}).join("")}
    function attemptRows(includeSignals=false){return nodeOrder.map(nodeId=>{const [label,sub]=nodeLabels[nodeId],related=run().attempts.filter(item=>item.node===nodeId),status=run().nodeStates[nodeId],span=nodeSpan(nodeId);let rows=traceRow(label,sub,nodeId,status,span?bar(span.start,span.end,span.status,`${related.length} Attempt${related.length===1?"":"s"}`,nodeId):"");rows+=related.map(item=>attemptRow(item,includeSignals)).join("");return rows}).join("")}
    function attemptRow(item,includeSignals){const attempt=traceRow(`${item.kind} · ${item.id.split(":").at(-1)}`,`${item.turns} turns · ${item.tokens.toLocaleString()} tokens`,item.id,item.status,`${bar(item.start,item.end,item.status,fmt(item.duration),item.id,item.worker)}${item.status==="failure"?`<span class="failure-pin" style="left:${pct(item.end)}%" title="${item.fact}"></span>`:""}`,15);if(!includeSignals)return attempt;return `${attempt}<div class="trace-row signal-row"><div class="trace-label"><span class="indent" style="--indent:30px"><b>Duration-only signals</b><small>Not positioned on wall time</small></span>${tag("partial","unaligned")}</div><div class="signal-track"><span class="signal"><b>${fmt(item.firstOutput)}</b><small>first output</small></span><span class="signal"><b>${fmt(item.worker)}</b><small>worker duration</small></span><span class="signal"><b>${fmt(item.tools)}</b><small>tool duration</small></span><span class="signal"><b>${item.turns}</b><small>Worker Turns</small></span><span class="signal"><b>${item.fact}</b><small>typed fact</small></span></div></div>`}
    function eventRow(){return `<div class="trace-row event-row"><div class="trace-label"><span><b>Run Events</b><small>${run().eventCount} gapless event-v2 records</small></span>${tag("observed","authoritative")}</div><div class="track">${run().events.map(item=>`<button class="event-pin ${item.kind} ${state.selected===`event:${item.seq}`?"selected":""}" data-event="${item.seq}" style="left:${pct(item.time)}%" aria-label="Event ${item.seq}: ${item.name}" title="Event ${item.seq}: ${item.name} · ${fmt(item.time)}"></button>`).join("")}${cursor()}</div></div>`}
    function traceLegend(){return `<div class="legend"><span><i class="key"></i>accepted</span><span><i class="key repair"></i>repair</span><span><i class="key failure"></i>rejected</span><span>Attempt envelopes are absolute.</span><span>Signal rows are duration-only.</span>${tag("partial","provider/tool intervals unavailable")}</div>`}
    function tracePane(){const body=state.detail==="nodes"?nodeRows():state.detail==="attempts"?attemptRows(false):`${eventRow()}${attemptRows(true)}`;return `<main class="trace-pane"><div class="pane-head"><div class="trace-controls"><h2>Waterfall</h2><div class="detail-control">${["nodes","attempts","signals"].map(level=>`<button class="button ${state.detail===level?"active":""}" data-detail="${level}">${level[0].toUpperCase()+level.slice(1)}</button>`).join("")}</div></div><div class="pane-actions"><label class="zoom">Zoom <input id="zoom" type="range" min="100" max="200" value="${state.zoom}"></label>${maxButton("trace")}</div></div><div class="trace-scroll"><div class="waterfall" style="--trace-width:${state.zoom}%">${axis()}${body}${traceLegend()}</div></div></main>`}
    function selectedEntity(){if(state.selected==="run")return{title:run().runId,kind:"Execution Run",status:run().outcome,duration:fmt(run().duration),tokens:run().tokens?run().tokens.toLocaleString():"—",cost:money(run().cost),fact:`run-finished / ${run().outcome}`,source:"events.jsonl",location:`events 1–${run().eventCount}`,evidence:"Observed"};if(state.selected.startsWith("event:")){const sequence=Number(state.selected.split(":")[1]),event=run().events.find(item=>item.seq===sequence);return{title:`Event ${sequence} · ${event.name}`,kind:"Run Event",status:event.kind||"recorded",duration:fmt(event.time),tokens:"—",cost:"—",fact:event.name,source:"events.jsonl",location:`line / sequence ${sequence}`,evidence:"Observed"}}const attempt=run().attempts.find(item=>item.id===state.selected);if(attempt)return{title:attempt.id,kind:attempt.kind,status:attempt.status==="failure"?"rejected":attempt.action,duration:fmt(attempt.duration),tokens:attempt.tokens.toLocaleString(),cost:money(attempt.cost),fact:attempt.fact,source:attempt.source,location:attempt.event,evidence:"Observed"};const nodeId=nodeOrder.includes(state.selected)?state.selected:state.graphNode,[label]=nodeLabels[nodeId],span=nodeSpan(nodeId);return{title:label,kind:"DAG Node",status:run().nodeStates[nodeId],duration:span?fmt(span.end-span.start):"Unavailable",tokens:"See Attempts",cost:"See Attempts",fact:`node state / ${run().nodeStates[nodeId]}`,source:"events.jsonl + execution packet",location:`Node ${nodeId}`,evidence:span?"Observed + Derived":"Observed"}}
    function observations(){if(run().id==="dry")return[{title:"No Execution Run work was performed",detail:"Dry-run completed after preflight; timing, token, and cost analysis is unavailable.",select:"event:3"}];if(run().id==="failed")return[{title:"Runtime failed after three Attempts",detail:"Each Attempt recorded validation/program-failure; repair budget ended in fail.",select:"runtime-abort-grounded:000003"},{title:"Runtime tests was skipped",detail:"The Node completion cause names failed upstream Runtime work.",select:"runtime-tests-grounded"}];return[{title:"Integration conflict led to one repair",detail:"The original Runtime candidate conflicted with accepted sibling state.",select:"runtime-abort-grounded:000001"},{title:"Node Validation led to one repair",detail:"Three AVA tests rejected the original Runtime tests candidate.",select:"runtime-tests-grounded:000001"},{title:"Final Validation passed in 7.029s",detail:"The accepted ledger reconstructed to the expected tree and passed 56 tests.",select:"final-validation"}]}
    function inspector(){const item=selectedEntity();return `<aside class="inspector"><div class="pane-head"><div><h2>Inspector</h2><small>Selection-linked</small></div>${maxButton("inspector")}</div><section><div class="inline" style="justify-content:space-between"><h3>Selected evidence</h3>${tag(item.status==="rejected"||item.status==="failed"?"failure":item.status.includes?.("repair")?"repair":item.status==="skipped"||item.status==="planned"||item.status==="dry-run-completed"?"partial":"observed",item.status)}</div><strong class="mono" style="font-size:.65rem;overflow-wrap:anywhere">${item.title}</strong><dl style="margin-top:8px"><dt>Kind</dt><dd>${item.kind}</dd><dt>Duration</dt><dd>${item.duration}</dd><dt>Tokens</dt><dd>${item.tokens}</dd><dt>Cost</dt><dd>${item.cost}</dd><dt>Typed fact</dt><dd class="mono">${item.fact}</dd></dl></section><section><h3>Diagnostic Observations</h3>${observations().map(observation=>`<button class="observation" data-select="${observation.select}"><b>${observation.title}</b><small>${observation.detail}</small></button>`).join("")}</section><section class="receipt"><h3>Evidence Receipt</h3><dl><dt>Evidence class</dt><dd>${item.evidence}</dd><dt>Generation</dt><dd>packet-v6 / event-v2 / projection-v3</dd><dt>Source</dt><dd class="mono">${item.source}</dd><dt>Location</dt><dd class="mono">${item.location}</dd><dt>Run identity</dt><dd class="mono">${run().runId}</dd></dl></section><section><h3>Limitations</h3><div class="notice">Canonical Worker Turn, Provider Response, Provider Poll, and Tool Invocation records lack absolute intervals. The waterfall does not estimate their placement.</div></section></aside>`}
    function workspace(){return `<div class="workspace ${state.maximized?`max-${state.maximized}`:""}">${leftRail()}${tracePane()}${inspector()}</div>`}
    function wire(){document.querySelectorAll("[data-run]").forEach(element=>element.addEventListener("click",()=>{state.runId=element.dataset.run;state.selected="run";state.graphNode="runtime-abort-grounded";render()}));document.querySelectorAll("[data-node]").forEach(element=>bindSelect(element,()=>{state.graphNode=element.dataset.node;state.selected=element.dataset.node}));document.querySelectorAll("[data-select]").forEach(element=>bindSelect(element,()=>{state.selected=element.dataset.select;const attempt=run().attempts.find(item=>item.id===state.selected);if(attempt)state.graphNode=attempt.node;else if(nodeOrder.includes(state.selected))state.graphNode=state.selected}));document.querySelectorAll("[data-event]").forEach(element=>bindSelect(element,()=>{state.selected=`event:${element.dataset.event}`}));document.querySelectorAll("[data-detail]").forEach(element=>element.addEventListener("click",()=>{state.detail=element.dataset.detail;render()}));document.querySelectorAll("[data-maximize]").forEach(element=>element.addEventListener("click",()=>{state.maximized=state.maximized===element.dataset.maximize?null:element.dataset.maximize;render()}));document.getElementById("zoom")?.addEventListener("input",event=>{state.zoom=Number(event.target.value);render()})}
    function bindSelect(element,update){const select=()=>{update();render()};element.addEventListener("click",select);element.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();select()}})}
    function render(){document.getElementById("app").innerHTML=`${topbar()}${runStrip()}${workspace()}`;wire()}
    window.addEventListener("keydown",event=>{if(event.key==="Escape"&&state.maximized){state.maximized=null;render()}});render();
  </script>
</body>
</html>
