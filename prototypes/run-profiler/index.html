    function inspector(){const item=selectionEntity(),time=cursorTime();return`<aside class="inspector"><div class="pane-head"><div class="pane-title"><h2>Inspector</h2><small>Selection-linked evidence</small></div>${maxButton("inspector")}</div><section><div class="inline" style="justify-content:space-between"><h3>Selected evidence</h3>${tag(stateType(item.status),item.status)}</div><strong class="mono selected-title">${item.title}</strong><dl style="margin-top:8px"><dt>Kind</dt><dd>${item.kind}</dd><dt>Typed fact</dt><dd class="mono">${item.fact}</dd>${item.patch?`<dt>Patch / apply</dt><dd>${item.patch}</dd>`:""}</dl></section>${routingInspector()}<section><h3>Metrics</h3>${metrics(item)}${item.validation!=null?`<dl style="margin-top:8px"><dt>Validation detail</dt><dd>xo 933.437ms · ava 3,869.742ms</dd><dt>Apply check</dt><dd>Conflict: expected base tree 8a2aeffb…, got 28dc1d3a…</dd></dl>`:""}</section><section><h3>Diagnostic Observations</h3>${observations().map(item=>`<button class="observation" data-select="${item.select}"><b>${item.title}</b><small>${item.detail}</small></button>`).join("")}</section><section class="receipt"><h3>Evidence Receipt</h3><dl><dt>Evidence cursor</dt><dd class="mono">${time==null?"No trace selection":`${fmt(time)} from run start`}</dd><dt>Evidence class</dt><dd>${evidenceClass(item)}</dd><dt>Source</dt><dd class="mono">${item.source}</dd><dt>Location</dt><dd class="mono">${item.location}</dd><dt>Run identity</dt><dd class="mono">${currentRun().runId}</dd><dt>Provenance</dt><dd>Raw local observability is formally classified Partial — diagnostic/path-only. Absolute Run and Attempt facts remain authoritative from events.jsonl and Attempt Outcomes.</dd></dl></section><section><h3>Availability</h3><div class="notice">The completed Runtime original Attempt embeds all 37 raw observability records. Other Attempts honestly retain only their available envelope and outcome evidence in this throwaway prototype.</div></section></aside>`}

    function workspace(){return`<div class="workspace ${state.maximized?`max-${state.maximized}`:""}" style="--left:${state.left}px;--right:${state.right}px;--dag:${state.dag}%;--trace:${state.trace}%">${leftRail()}${separator("left","Resize DAG column","vertical","left-resizer")}${tracePane()}${separator("right","Resize inspector column","vertical","right-resizer")}${inspector()}</div>`}
    function bindSelect(element,update){const select=()=>{update();render()};element.addEventListener("click",select);element.addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&element.tagName!=="BUTTON"){event.preventDefault();select()}})}
    function resizeByKey(kind,delta){if(kind==="left")state.left=Math.max(210,Math.min(480,state.left+delta));if(kind==="right")state.right=Math.max(240,Math.min(500,state.right-delta));if(kind==="dag")state.dag=Math.max(45,Math.min(82,state.dag+delta/4));if(kind==="trace")state.trace=Math.max(35,Math.min(78,state.trace+delta/4));if(kind==="evidence")state.evidence=Math.max(20,Math.min(50,state.evidence+delta/4));render()}
    function startResize(element,event){event.preventDefault();const kind=element.dataset.resize,startX=event.clientX,startY=event.clientY,start={left:state.left,right:state.right,dag:state.dag,trace:state.trace,evidence:state.evidence},workspaceElement=document.querySelector(".workspace"),leftRailElement=document.querySelector(".left-rail"),traceElement=document.querySelector(".trace-pane"),evidenceElement=document.querySelector(".evidence");element.classList.add("dragging");const move=moveEvent=>{if(kind==="left")state.left=Math.max(210,Math.min(480,start.left+moveEvent.clientX-startX));if(kind==="right")state.right=Math.max(240,Math.min(500,start.right-(moveEvent.clientX-startX)));if(kind==="dag")state.dag=Math.max(45,Math.min(82,start.dag+(moveEvent.clientY-startY)/leftRailElement.clientHeight*100));if(kind==="trace")state.trace=Math.max(35,Math.min(78,start.trace+(moveEvent.clientY-startY)/traceElement.clientHeight*100));if(kind==="evidence")state.evidence=Math.max(20,Math.min(50,start.evidence+(moveEvent.clientX-startX)/evidenceElement.clientWidth*100));(kind==="evidence"?evidenceElement:workspaceElement).style.setProperty(`--${kind}`,`${state[kind]}${kind==="left"||kind==="right"?"px":"%"}`)};const end=()=>{element.classList.remove("dragging");window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",end)};window.addEventListener("pointermove",move);window.addEventListener("pointerup",end)}
    function ledgerSelection(id){if(id.startsWith("event:"))return id;if(id.startsWith("attempt:"))return id.slice(8);if(id.startsWith("turn-ledger:"))return`turn:${id.slice(12)}`;if(id.startsWith("tool-ledger:"))return`tool:${id.slice(12)}`;if(id.startsWith("stage:"))return id.slice(6,id.lastIndexOf(":"));return null}
    function ensureAncestors(selection,logId=null){let nodeId=null,attemptId=null,turnIndex=null;if(logId?.startsWith("stage:")){attemptId=ledgerSelection(logId);state.openAttempts.add(attemptKey(attemptId))}else if(selection.startsWith("tool:")){const tool=tools[Number(selection.slice(5))];attemptId=deepAttemptId;turnIndex=tool?.turn;state.openAttempts.add(attemptKey(attemptId));if(turnIndex!=null)state.openTurns.add(turnKey(turnIndex))}else if(selection.startsWith("turn:")){attemptId=deepAttemptId;state.openAttempts.add(attemptKey(attemptId))}else if(selection.startsWith("event:")){const sequence=Number(selection.slice(6));attemptId=associatedAttempt(sequence)?.id||null;if(!attemptId&&currentRun().id==="completed"&&[20,21].includes(sequence))nodeId="final-validation"}else if(attemptById(selection))attemptId=selection;else if(nodeOrder.includes(selection))nodeId=selection;if(attemptId)nodeId=attemptById(attemptId)?.node||null;state.graphNode=nodeId;if(nodeId)setOpenNode(nodeId)}
    function selectScope(selection,logId=null){state.selected=selection;state.logSelection=logId;if(selection==="run"){state.graphNode=null;return}ensureAncestors(selection,logId)}
    function wire(){document.querySelectorAll("[data-run]").forEach(element=>element.addEventListener("click",()=>{state.runId=element.dataset.run;state.selected=null;clearLogSelection();state.graphNode=null;render()}));document.querySelectorAll("[data-select-run]").forEach(element=>element.addEventListener("click",()=>{selectScope("run");render()}));document.querySelectorAll("[data-node]").forEach(element=>bindSelect(element,()=>{const node=element.dataset.node,wasOpen=openNode()===node;selectScope(node);setOpenNode(wasOpen?null:node)}));document.querySelectorAll("[data-toggle-node]").forEach(element=>bindSelect(element,()=>{const node=element.dataset.toggleNode,wasOpen=openNode()===node;selectScope(node);setOpenNode(wasOpen?null:node)}));document.querySelectorAll("[data-toggle-attempt]").forEach(element=>bindSelect(element,()=>{const id=element.dataset.toggleAttempt;selectScope(id);toggleAttempt(id)}));document.querySelectorAll("[data-toggle-turn]").forEach(element=>bindSelect(element,()=>{const id=element.dataset.toggleTurn;selectScope(id);toggleTurn(Number(id.slice(5)))}));document.querySelectorAll("[data-select]").forEach(element=>bindSelect(element,()=>selectScope(element.dataset.select)));document.querySelectorAll("[data-event]").forEach(element=>element.addEventListener("click",()=>{selectScope(`event:${element.dataset.event}`);render()}));document.querySelectorAll("[data-log]").forEach(element=>element.addEventListener("click",()=>{const id=element.dataset.log,selection=ledgerSelection(id);if(selection)selectScope(selection,id);render()}));document.querySelectorAll("[data-crumb]").forEach(element=>element.addEventListener("click",()=>{const item=breadcrumbItems()[Number(element.dataset.crumb)];selectScope(item.selection,item.logId||null);render()}));document.querySelectorAll("[data-maximize]").forEach(element=>element.addEventListener("click",()=>{state.maximized=state.maximized===element.dataset.maximize?null:element.dataset.maximize;render()}));document.querySelectorAll("[data-resize]").forEach(element=>{element.addEventListener("pointerdown",event=>startResize(element,event));element.addEventListener("keydown",event=>{const delta=event.key==="ArrowLeft"||event.key==="ArrowUp"?-12:event.key==="ArrowRight"||event.key==="ArrowDown"?12:0;if(delta){event.preventDefault();resizeByKey(element.dataset.resize,delta)}})});document.getElementById("zoom")?.addEventListener("input",event=>{state.zoom=Number(event.target.value);document.querySelector(".waterfall")?.style.setProperty("--trace-width",`${state.zoom}%`)});document.querySelector("[data-log-sort]")?.addEventListener("click",()=>{state.logSort=state.logSort==="chronological"?"longest":"chronological";render()});document.querySelector("[data-refresh]")?.addEventListener("click",render)}
    function render(){document.getElementById("app").innerHTML=`${topbar()}${runStrip()}${workspace()}`;wire()}
    window.addEventListener("keydown",event=>{if(event.key==="Escape"){state.selected=null;state.logSelection=null;state.graphNode=null;state.maximized=null;render()}});
    validateFixture();
    render();
  </script>
</body>
